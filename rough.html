<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<!-- iPad: ホーム画面に追加すると Safari のバーごと消えた「アプリ」として起動する（SPEC_18。manifest は張らない） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROUGH">
<title>ROUGH — ラフ原を手探りで動かす</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<!--
  ROUGH（SPEC_22）— ラフ原専用の小さな作画アプリ。ANIMATOR の「描き味・塗り・空コマを押すとコマが出来る」はそのまま、
  レーンは1本（線も塗りも同じ1枚）・色は 白〜黒の明度11段＋下書＋指示 の13色だけ。
  SEL で今のラフを切り貼り → 「次のコマへ ▶」で少し動いた次のコマの下絵を作る、を最短手数にしたのが本体。
  出口は PNG ／ 連番 PNG（ZIP）／ → ANIMATOR REF（共有DB tdr_exchange ＋ tdr_live）。
  デザインは LIVE PLATE と同じ SPOTLIGHT。パネルはドック式（左右・下）で、見出しの ⇱ か見出しドラッグで浮かせられる。
  ★ 画素は「色番号」1バイト/px で持つ（0=透明・1〜11=明度 0〜100%・12=下書・13=指示）。描くのも塗るのも番号の配列に直接。
    表示するときだけ LUT で RGBA にする＝下書の色を変えると全コマが変わる・下書だけ隠す／書き出さないが1行で済む。
  ★ このコメントに山かっこ付きの script を書かないこと（tools/check.js がタグとして拾う）。
-->
<style>
:root{
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --bg:#08090C;--ink:#E8ECF2;
  --panel:rgba(10,12,16,.95);--cell:rgba(232,236,242,.03);
  --grey:rgba(232,236,242,.55);--dim:rgba(232,236,242,.3);
  --line:rgba(232,236,242,.14);--line-2:rgba(232,236,242,.08);
  --danger:#FF5A5A;--dangerRGB:255,90,90;
  --mark:#FFC94F;
  --saira:'Saira Condensed','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
  --mono:'JetBrains Mono','IBM Plex Mono','Menlo','Consolas',monospace;
  --jp:'Noto Sans JP',-apple-system,'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
  /* THEME: SPOTLIGHT（LIVE PLATE と同じ。ICE→紫→ROUGE の斜め掃引） */
  --acc:#C46BFF;--accRGB:196,107,255;--acc2:#9BF3FF;--acc2RGB:155,243,255;
  --acc-fill:linear-gradient(118deg,#5AE9FF,#8F7BFF 40%,#FF4FA8 72%,#B850FF 100%);--acc-ink:#FFFFFF;
  --acc-border:linear-gradient(118deg,#5AE9FF,#8F7BFF 40%,#FF4FA8 72%,#B850FF 100%);
  --acc-pt:#5AE9FF;--acc-ptRGB:90,233,255;
  --acc-inset:inset 0 1px 0 rgba(255,255,255,.35);
  --acc-glow:0 0 18px rgba(196,107,255,.45);
  --acc-hover-fill:linear-gradient(180deg,rgba(90,233,255,.22),rgba(184,80,255,.12));
  --acc-hover-line:#9BF3FF;
  --rail:84px;--wide:248px;
}
@keyframes nowGlow{
  0%,100%{box-shadow:0 0 0 1px rgba(var(--accRGB),.55),0 0 18px rgba(var(--accRGB),.18)}
  50%{box-shadow:0 0 0 1px rgba(var(--accRGB),.9),0 0 26px rgba(var(--accRGB),.34)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:rgba(232,236,242,.04)}
*::-webkit-scrollbar-thumb{background:rgba(var(--accRGB),.45);border:2px solid transparent;background-clip:padding-box}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{
  background:
    radial-gradient(ellipse 70% 60% at 50% 46%,transparent 40%,rgba(4,5,7,.72) 100%),
    linear-gradient(180deg,#0A0C11,#07080B 62%,#0A0B0F);
  color:var(--ink);font-family:var(--mono);font-size:11px;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}

/* ---------- 汎用ボタン（LIVE PLATE theme.css と同じ顔） ---------- */
.btn{
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;flex:none;
  border:1px solid var(--line);background:var(--cell);color:rgba(232,236,242,.72);text-decoration:none;white-space:nowrap;
  font-family:var(--saira);font-weight:600;font-size:11px;letter-spacing:.16em;transition:background .12s,border-color .12s,box-shadow .12s;
}
.btn:hover{background:var(--acc-hover-fill);border-color:var(--acc-hover-line);color:var(--ink);box-shadow:var(--acc-glow)}
.btn:active{filter:brightness(1.18)}
.btn.on{background:var(--acc-fill);border-color:transparent;color:var(--acc-ink);box-shadow:var(--acc-inset),var(--acc-glow)}
.btn.go{border:1px solid rgba(var(--accRGB),.85);border-image:var(--acc-border) 1;background:rgba(var(--accRGB),.14);color:var(--acc2)}
.btn.go:hover{background:var(--acc-fill);color:#fff}
.btn.ico{width:32px;padding:0;font-family:var(--mono);font-size:13px;letter-spacing:0}
.btn:disabled,.btn.off{opacity:.32;pointer-events:none}
.btn.del{border-color:rgba(var(--dangerRGB),.4);color:rgba(255,138,138,.9)}
.hb{flex:none;width:24px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;background:none;color:rgba(255,255,255,.55);font-family:var(--mono);font-size:11px}
.hb:hover{background:rgba(232,236,242,.08);border-color:rgba(232,236,242,.22);color:#fff}

/* ---------- 画面の骨組み：上バー／左ドック／ステージ／右ドック／下ドック ---------- */
#app{position:fixed;inset:0;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-rows:calc(50px + var(--safe-t)) minmax(0,1fr) auto;
  grid-template-areas:"bar bar bar" "dl stage dr" "db db db"}
#bar{grid-area:bar;position:relative;z-index:50;display:flex;align-items:center;gap:8px;overflow:hidden;
  padding:var(--safe-t) 12px 0;border-bottom:1px solid var(--line);
  background:linear-gradient(to bottom,rgba(6,7,10,.94),rgba(6,7,10,.8))}
#bar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--accRGB),.5) 16%,rgba(var(--accRGB),.07) 62%,transparent)}
.brand{display:flex;align-items:center;gap:10px;flex:none;color:inherit;text-decoration:none}
.brand svg{display:block;flex:none}
.brand .bwrap{display:flex;flex-direction:column;gap:3px}
.brand .bname{font-family:var(--saira);font-weight:700;font-size:18px;letter-spacing:.16em;line-height:.9}
.brand .bsub{font-size:7.5px;letter-spacing:.26em;color:rgba(232,236,242,.4);line-height:1}
#bar-info{display:flex;align-items:baseline;gap:10px;margin-left:10px;min-width:0;overflow:hidden;white-space:nowrap;
  font-size:9px;letter-spacing:.14em;color:rgba(232,236,242,.42)}
#bar-info b{font-family:var(--saira);font-weight:700;font-size:16px;letter-spacing:.08em;color:var(--acc2);font-variant-numeric:tabular-nums}
#bar-info .nm{font-family:var(--jp);font-size:11px;letter-spacing:.06em;color:rgba(232,236,242,.7);max-width:12em;overflow:hidden;text-overflow:ellipsis}
#bar .flex{flex:1;min-width:4px}
#save-st{flex:none;font-size:8.5px;letter-spacing:.16em;color:rgba(232,236,242,.38);margin-right:4px}
#save-st.busy{color:var(--mark)}
#save-st.err{color:var(--danger)}
.bsep{flex:none;width:1px;height:22px;background:var(--line-2);margin:0 2px}
@media (max-width:1180px){.brand .bsub{display:none}#bar-info .opt{display:none}}
@media (max-width:980px){.brand .bwrap{display:none}#b-send .t2{display:none}#save-st{display:none}}

/* ---------- ドック ---------- */
.dock{position:relative;z-index:20;display:flex;flex-direction:column;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;
  background:rgba(8,9,12,.86);border-color:var(--line);border-style:solid;border-width:0}
#dock-l{grid-area:dl;border-right-width:1px}
#dock-r{grid-area:dr;border-left-width:1px}
#dock-b{grid-area:db;border-top-width:1px;overflow:visible;padding-bottom:var(--safe-b)}
.dock.empty{width:0;border-width:0!important;padding:0}
#dock-b.empty{height:0;padding:0}
.dock .pnl{border-bottom:1px solid var(--line-2)}
.pnl{display:flex;flex-direction:column;min-width:0;background:transparent;width:var(--wide)}
.pnl[data-kind="rail"]{width:var(--rail)}
.dock.wide .pnl{width:var(--wide)}
#dock-b .pnl{width:auto}
.ph{display:flex;align-items:center;gap:6px;height:30px;flex:none;padding:0 4px 0 9px;cursor:grab;touch-action:none;
  background:rgba(var(--accRGB),.045);border-bottom:1px solid var(--line-2)}
.ph:active{cursor:grabbing}
.ph .en{font-family:var(--saira);font-weight:700;font-size:12px;letter-spacing:.22em;color:var(--acc);white-space:nowrap}
.ph .jp{font-family:var(--jp);font-size:9px;letter-spacing:.1em;color:rgba(232,236,242,.36);white-space:nowrap;overflow:hidden}
.ph .sp{flex:1;min-width:0}
.ph .grip{font-size:10px;color:rgba(232,236,242,.3);margin-right:-2px}
.pnl[data-kind="rail"] .ph{padding:0 2px 0 6px;gap:3px}
.pnl[data-kind="rail"] .ph .en{font-size:10px;letter-spacing:.14em}
.dock.wide .pnl[data-kind="rail"] .ph .en{font-size:12px;letter-spacing:.22em}
.pnl[data-kind="rail"] .ph .jp{display:none}
.pnl[data-kind="rail"] .hb.mn{display:none}
.dock.wide .pnl[data-kind="rail"] .hb.mn,.pnl.float[data-kind="rail"] .hb.mn{display:inline-flex}
.pb{flex:none;min-height:0}
.pnl.mini .pb{display:none}
.pnl.float{position:fixed;z-index:60;border:1px solid rgba(232,236,242,.2);background:rgba(9,10,14,.95);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 26px 60px rgba(0,0,0,.6);max-height:calc(100vh - 70px)}
.pnl.float .pb{overflow-y:auto;overflow-x:hidden;flex:0 1 auto}
.pnl.float .ph{background:rgba(var(--accRGB),.09)}
.pnl.float[data-pid="timeline"]{width:min(1180px,94vw)}
.pnl.lifting{opacity:.85;box-shadow:0 0 0 1px var(--acc),0 30px 80px rgba(0,0,0,.7)}
.dz{position:fixed;z-index:58;display:none;pointer-events:none;border:1px dashed rgba(var(--acc-ptRGB),.55);background:rgba(var(--acc-ptRGB),.05)}
body.docking .dz{display:block}
.dz.hot{border:2px solid var(--acc-pt);background:rgba(var(--acc-ptRGB),.16);box-shadow:inset 0 0 30px rgba(var(--acc-ptRGB),.25)}
.dz span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--saira);font-weight:700;font-size:11px;letter-spacing:.3em;color:var(--acc2);white-space:nowrap}
#dz-l span,#dz-r span{writing-mode:vertical-rl}

/* ---------- TOOLS（レール）／COLOR ---------- */
.rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 9px}
.dock.wide .rail,.pnl.float .rail{flex-direction:row;flex-wrap:wrap;justify-content:center;padding:8px 8px 10px}
.rail .sep{width:56px;height:1px;background:var(--line-2);margin:3px 0}
.dock.wide .rail .sep,.pnl.float .rail .sep{width:100%;margin:2px 0}
.tool{position:relative;width:68px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:1px solid var(--line);background:var(--cell);color:rgba(232,236,242,.75);touch-action:manipulation;transition:background .12s,border-color .12s}
.tool svg{width:22px;height:22px;pointer-events:none}
.tool .lbl{font-family:var(--saira);font-weight:600;font-size:10.5px;letter-spacing:.2em;pointer-events:none}
.tool:hover{background:var(--acc-hover-fill);border-color:var(--acc-hover-line)}
.tool.on{background:var(--acc-fill);border-color:transparent;color:#fff;box-shadow:var(--acc-inset),var(--acc-glow)}
.tool .bd{position:absolute;right:2px;top:2px;min-width:12px;padding:0 2px;font-size:7px;letter-spacing:.04em;line-height:11px;text-align:center;pointer-events:none;
  color:#08090C;background:var(--mark);display:none}
.tool .bd.show{display:block}
.tool .bd.ice{background:var(--acc-pt)}
.sizes{display:flex;flex-direction:column;gap:3px}
.dock.wide .sizes,.pnl.float .sizes{flex-direction:row}
.sz{width:68px;height:34px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--cell);
  color:rgba(232,236,242,.7);font-family:var(--saira);font-weight:600;font-size:12px;letter-spacing:.06em;touch-action:none}
.sz i{display:block;border-radius:50%;background:currentColor;flex:none}
.sz.on{border-color:var(--acc-hover-line);color:var(--acc2);background:rgba(var(--acc2RGB),.08)}
.sz.big{cursor:ns-resize}
.sz.big.drag{box-shadow:var(--acc-glow);border-color:var(--acc)}
#col-cur{width:68px;height:30px;border:1px solid rgba(232,236,242,.4);display:flex;align-items:flex-end;justify-content:flex-end;padding:2px 4px;
  font-family:var(--saira);font-weight:700;font-size:10px;letter-spacing:.1em;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.grays{display:grid;grid-template-columns:repeat(2,32px);gap:3px}
.dock.wide #col-cur,.pnl.float #col-cur{width:100%;height:24px}
.dock.wide .grays,.pnl.float .grays{grid-template-columns:repeat(11,18px);gap:2px}
.chip{width:32px;height:22px;padding:0;border:1px solid rgba(232,236,242,.22);position:relative;touch-action:manipulation}
.dock.wide .chip,.pnl.float .chip{width:18px;height:26px}
.chip.on{outline:2px solid var(--acc2);outline-offset:1px;z-index:1}
.chip span{position:absolute;right:2px;bottom:1px;font-size:6.5px;letter-spacing:0;pointer-events:none;mix-blend-mode:difference;color:#fff}
.dock.wide .chip span,.pnl.float .chip span{display:none}
.ink{width:68px;height:32px;display:flex;align-items:center;gap:6px;padding:0 6px;border:1px solid var(--line);background:var(--cell);
  font-family:var(--jp);font-size:11px;color:rgba(232,236,242,.8);touch-action:manipulation}
.ink i{width:16px;height:16px;flex:none;border:1px solid rgba(255,255,255,.3)}
.ink.on{border-color:var(--acc2);background:rgba(var(--acc2RGB),.1);box-shadow:0 0 0 1px var(--acc2)}
.ink-ops{display:flex;gap:3px}
.ink-ops button{width:32px;height:22px;border:1px solid var(--line-2);background:transparent;color:rgba(232,236,242,.55);font-size:10px;padding:0}
.ink-ops button.off{color:var(--mark);border-color:rgba(255,201,79,.5)}
.ink-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.dock.wide .ink-wrap,.pnl.float .ink-wrap{flex-direction:row}
.tone-wrap{flex-direction:row!important;gap:4px}
.tone-b{width:32px;height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border:1px solid var(--line);background:var(--cell);
  font-family:var(--saira);font-weight:600;font-size:10px;letter-spacing:.08em;color:rgba(232,236,242,.7);touch-action:manipulation}
.tone-b i{width:18px;height:10px;background:radial-gradient(circle,currentColor 32%,transparent 36%) 0 0/4px 4px}
#tone-2 i{background-size:3px 3px;background-image:radial-gradient(circle,currentColor 45%,transparent 50%)}
.tone-b.on{background:var(--acc-fill);border-color:transparent;color:#fff;box-shadow:var(--acc-glow)}
.mini-k{font-size:7.5px;letter-spacing:.18em;color:rgba(232,236,242,.35)}

/* ---------- 数値スクラブ（左右ドラッグ・Wクリックで直接入力。SPEC_18：素の input[type=number] を置かない） ---------- */
.scr{display:inline-flex;align-items:baseline;gap:4px;flex:none;cursor:ew-resize;touch-action:none;padding:2px 0}
.scr .k{font-size:8px;letter-spacing:.18em;color:rgba(232,236,242,.38)}
.scr .v{font-family:var(--saira);font-weight:600;font-size:15px;color:var(--ink);line-height:1;min-width:1.4em;
  border-bottom:1px dashed rgba(232,236,242,.36);font-variant-numeric:tabular-nums}
.scr .u{font-size:8px;letter-spacing:.1em;color:rgba(232,236,242,.3)}
.scr:hover .v{border-bottom-color:var(--acc)}
.scr input{width:4.6em;height:20px;padding:0 4px;border:1px solid var(--acc);background:rgba(var(--accRGB),.12);color:var(--ink);font-family:var(--saira);font-weight:600;font-size:14px}
.scr input:focus{outline:none}

/* ---------- 中身の語彙 .qd-*（OBAN / LIVE PLATE と同じ） ---------- */
.qd-sect{display:flex;align-items:baseline;gap:9px;padding:11px 11px 4px;border-top:1px solid rgba(232,236,242,.06)}
.qd-sect:first-child{border-top:0;padding-top:9px}
.qd-sect .en{font-family:var(--saira);font-weight:600;font-size:11px;letter-spacing:.26em;color:var(--acc)}
.qd-sect .jp{font-family:var(--jp);font-size:9px;letter-spacing:.12em;color:rgba(232,236,242,.4)}
.qd-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:5px 11px;min-height:32px}
.qd-row>.k{width:44px;flex:none;font-family:var(--jp);font-size:10.5px;letter-spacing:.06em;color:rgba(232,236,242,.6)}
.qd-seg{display:flex;gap:2px;flex-wrap:wrap;min-width:0}
.qd-sb{height:28px;padding:0 9px;flex:none;display:flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid rgba(232,236,242,.18);background:transparent;transition:background .12s,border-color .12s;
  font-family:var(--saira);font-weight:600;font-size:11.5px;letter-spacing:.12em;color:rgba(232,236,242,.62)}
.qd-sb:hover{background:var(--acc-hover-fill);border-color:var(--acc-hover-line);color:var(--ink)}
.qd-sb.on{background:var(--acc);border-color:transparent;color:var(--acc-ink);font-weight:700}
.qd-sb.jp{font-family:var(--jp);font-weight:400;font-size:10.5px;letter-spacing:.04em}
.qd-sb.del{border-color:rgba(var(--dangerRGB),.4);color:rgba(255,138,138,.9)}
.qd-sb.wide{flex:1}
.qd-sb:disabled{opacity:.3;pointer-events:none}
.qd-note{font-family:var(--jp);font-size:9px;letter-spacing:.06em;color:rgba(232,236,242,.4);line-height:1.65;padding:2px 11px 6px}
.qd-note b{color:var(--acc2);font-weight:400}
.qd-big{width:100%;height:40px;font-size:13px;letter-spacing:.2em}

/* REF の一覧 */
.ref-list{display:flex;flex-direction:column;gap:3px;padding:2px 8px 6px}
.rrow{display:flex;align-items:center;gap:5px;padding:3px 4px 3px 3px;border:1px solid var(--line-2);background:var(--cell);touch-action:manipulation}
.rrow.on{border:1px solid rgba(var(--accRGB),.85);border-image:var(--acc-border) 1;background:rgba(var(--accRGB),.12)}
.rrow .th{flex:none;width:44px;height:30px;background:repeating-conic-gradient(#2A2D34 0% 25%,#1C1F24 0% 50%) 50%/8px 8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.rrow .th img{max-width:100%;max-height:100%;display:block;pointer-events:none}
.rrow .nm{flex:1;min-width:0;font-family:var(--jp);font-size:10px;color:rgba(232,236,242,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .ic{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:none;font-size:10px;color:rgba(232,236,242,.6);padding:0}
.rrow .ic:hover{border-color:rgba(232,236,242,.25);color:#fff}
.rrow .ic.off{color:rgba(232,236,242,.2)}
.rrow .ic.lk{color:var(--mark)}
.rrow .ic.x{color:rgba(255,138,138,.85)}
.rrow.hid .th,.rrow.hid .nm{opacity:.35}

/* ---------- ステージ ---------- */
#stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;min-height:0;touch-action:none;
  background:
    linear-gradient(rgba(232,236,242,.025) 1px,transparent 1px) center/80px 80px,
    linear-gradient(90deg,rgba(232,236,242,.025) 1px,transparent 1px) center/80px 80px}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 18px 60px rgba(0,0,0,.55);background:#fff}
#wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#wrap.px canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#cv-ref.mono{filter:grayscale(1)}
#cv-ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#stage.pan{cursor:grab}
#stage.panning{cursor:grabbing}
#stage-tag{position:absolute;left:8px;bottom:8px;display:flex;gap:8px;align-items:center;pointer-events:none;padding:3px 9px;
  background:rgba(8,9,12,.72);border:1px solid var(--line-2);font-size:9px;letter-spacing:.14em;color:rgba(232,236,242,.62)}
#stage-tag b{font-family:var(--saira);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--acc2)}
#stage-tag .sw{display:inline-block;width:12px;height:12px;border:1px solid rgba(255,255,255,.5);vertical-align:-2px}
#stage-tag .emp{color:var(--mark);font-family:var(--saira);font-weight:700;font-size:12px;letter-spacing:.2em}
#stage-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:10px;pointer-events:none;text-align:center}
#stage-msg.show{display:flex}
#stage-msg .big{font-family:var(--saira);font-weight:700;font-size:clamp(18px,2.4vw,30px);letter-spacing:.3em;color:rgba(40,44,52,.55)}
#stage-msg .sm{font-family:var(--jp);font-size:11px;line-height:1.9;color:rgba(40,44,52,.6)}
#sel-hud{position:absolute;left:0;right:0;top:10px;margin:0 auto;width:max-content;z-index:5;display:none;align-items:center;gap:3px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100% - 20px);padding:5px;border:1px solid rgba(var(--accRGB),.6);background:rgba(9,10,14,.92);box-shadow:var(--acc-glow)}
#sel-hud.show{display:flex}
#sel-hud .btn{height:30px;padding:0 9px;font-size:11px}
#sel-hud .btn.jp{font-family:var(--jp);font-weight:500;font-size:10.5px;letter-spacing:.04em}
#sel-hud .hint{font-family:var(--jp);font-size:9.5px;color:rgba(232,236,242,.5);padding:0 6px;white-space:nowrap}
#sel-hud .vl{width:1px;height:20px;background:var(--line);margin:0 2px}
#zoom-hud{position:absolute;right:8px;bottom:8px;z-index:4;display:flex;align-items:center;gap:2px;padding:3px;
  border:1px solid var(--line-2);background:rgba(9,10,14,.8)}
#zoom-hud .btn{height:28px}
#zoom-hud .btn.ico{width:30px}
#zh-pct{min-width:46px;text-align:center;font-family:var(--saira);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--acc2)}
#zh-rot{min-width:40px}
#play-badge{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;pointer-events:none;
  font-family:var(--saira);font-weight:700;font-size:12px;letter-spacing:.3em;color:#fff;background:rgba(var(--accRGB),.75);padding:3px 12px}
body.playing #play-badge{display:block}
body.dragover #stage{outline:1px dashed rgba(var(--accRGB),.8);outline-offset:-10px}

/* ---------- タイムライン ---------- */
#tl-head{display:flex;align-items:center;gap:6px;height:38px;padding:0 8px;border-bottom:1px solid var(--line-2);overflow-x:auto;overflow-y:hidden}
#tl-head .btn{height:28px;padding:0 9px}
#tl-head .btn.ico{width:30px}
#tl-head .btn.jp{font-family:var(--jp);font-weight:500;font-size:10.5px;letter-spacing:.04em}
#tl-time{flex:none;min-width:7.6em;font-family:var(--saira);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--acc2);font-variant-numeric:tabular-nums}
#tl-time span{font-size:10px;color:rgba(232,236,242,.38);font-weight:600}
.tl-grp{display:flex;align-items:center;gap:3px;flex:none}
.tl-lab{font-family:var(--saira);font-weight:600;font-size:10px;letter-spacing:.2em;color:rgba(232,236,242,.45);margin:0 2px 0 4px}
.tl-vl{flex:none;width:1px;height:20px;background:var(--line-2);margin:0 3px}
#tl-head .sp{flex:1;min-width:6px}
.oni{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 7px;border:1px solid var(--line);background:var(--cell);font-family:var(--saira);font-weight:600;font-size:11px;letter-spacing:.06em}
.oni i{width:9px;height:9px;flex:none}
.oni.zero{opacity:.4}
#tl-body{position:relative;overflow-x:auto;overflow-y:hidden;height:88px;touch-action:pan-x}
#tl-inner{position:relative;height:100%}
#tl-ruler{position:absolute;left:0;top:0;height:18px;right:0;cursor:ew-resize;touch-action:none;border-bottom:1px solid var(--line-2);background:rgba(232,236,242,.02)}
#tl-ruler i{position:absolute;bottom:0;width:1px;height:4px;background:rgba(232,236,242,.16)}
#tl-ruler i.s{height:9px;background:rgba(232,236,242,.34)}
#tl-ruler u{position:absolute;top:1px;margin-left:3px;text-decoration:none;font-size:8px;letter-spacing:.06em;color:rgba(232,236,242,.42)}
#tl-cells{position:absolute;left:0;top:22px;height:62px;right:0}
.cel{position:absolute;top:0;height:62px;overflow:hidden;cursor:pointer;touch-action:pan-x;
  border:1px solid rgba(var(--acc-ptRGB),.4);background:#fff}
.cel canvas{position:absolute;left:0;top:0;height:46px;width:auto;pointer-events:none}
.cel .meta{position:absolute;left:0;right:0;bottom:0;height:16px;display:flex;align-items:center;gap:4px;padding:0 3px;
  background:rgba(8,9,12,.92);font-size:8.5px;letter-spacing:.04em;color:rgba(232,236,242,.7);pointer-events:none}
.cel .meta b{font-family:var(--saira);font-weight:700;font-size:10px;letter-spacing:.04em;color:rgba(232,236,242,.85)}
.cel .du{pointer-events:auto;cursor:pointer;padding:0 3px;margin-left:auto;color:var(--acc2)}
.cel .rh{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize;touch-action:none;background:rgba(8,9,12,.12);border-left:1px solid rgba(8,9,12,.15)}
.cel .rh::after{content:'';position:absolute;left:3px;top:18px;width:2px;height:12px;background:rgba(8,9,12,.4)}
.cel .rh:hover,.cel .rh.act{background:var(--acc-pt)}
.cel.cur{border:2px solid var(--acc);box-shadow:0 0 0 1px rgba(var(--accRGB),.5),var(--acc-glow);z-index:2}
.cel.cur .meta{background:rgba(var(--accRGB),.85);color:#fff}
.cel.cur .meta b{color:#fff}
.cel.cur .du{color:#fff}
.cel.emp{background:repeating-linear-gradient(135deg,rgba(232,236,242,.06) 0 4px,transparent 4px 8px);border:1px dashed rgba(232,236,242,.3)}
.cel.emp .ek{position:absolute;left:0;right:0;top:12px;text-align:center;font-family:var(--saira);font-weight:700;font-size:11px;letter-spacing:.2em;color:rgba(232,236,242,.4);pointer-events:none}
.cel.emp .rh{background:rgba(232,236,242,.05)}
.cel.lift{opacity:.4}
.cel.narrow .meta .nn{display:none}
.cel.narrow .rh{width:6px}
.cel.narrow .rh::after{display:none}
.tail{position:absolute;top:0;height:62px;border:1px dashed rgba(232,236,242,.18);display:flex;align-items:center;cursor:copy;touch-action:pan-x;
  background:repeating-linear-gradient(90deg,transparent 0 calc(var(--ppt) - 1px),rgba(232,236,242,.06) calc(var(--ppt) - 1px) var(--ppt))}
.tail .lbl{position:sticky;left:10px;font-family:var(--saira);font-weight:600;font-size:11px;letter-spacing:.24em;color:rgba(232,236,242,.4);padding:0 10px;pointer-events:none}
.tail:hover{border-color:rgba(var(--acc-ptRGB),.6)}
.tail .gh{position:absolute;top:2px;bottom:2px;width:var(--ppt);background:rgba(var(--acc-ptRGB),.25);border:1px solid var(--acc-pt);display:none;pointer-events:none}
.tail:hover .gh{display:block}
#tl-ph{position:absolute;top:0;bottom:0;width:1px;background:var(--acc-pt);pointer-events:none;box-shadow:0 0 6px rgba(var(--acc-ptRGB),.7);z-index:4}
#tl-ph::before{content:'';position:absolute;left:-5px;top:0;border:5px solid transparent;border-top-color:var(--acc-pt)}
#tl-drop{position:absolute;top:20px;height:66px;width:3px;margin-left:-1px;background:var(--acc-pt);display:none;box-shadow:0 0 8px rgba(var(--acc-ptRGB),.9);pointer-events:none;z-index:5}

/* ---------- 設定（manga-plate / LIVE PLATE と同じ：中央のオーバーレイ・段組） ---------- */
#set-ovl{position:fixed;inset:0;z-index:100;display:none;background:rgba(3,4,6,.6);align-items:center;justify-content:center;padding:calc(18px + var(--safe-t)) 18px calc(18px + var(--safe-b));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#set-ovl.show{display:flex}
#set-box{background:rgba(9,10,14,.97);border:1px solid rgba(232,236,242,.18);max-width:1100px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.7)}
#set-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:9px;height:44px;padding:0 13px;background:rgba(11,13,17,.97);border-bottom:1px solid rgba(232,236,242,.12)}
#set-head .ttl{font-family:var(--saira);font-weight:700;font-size:14px;letter-spacing:.24em;color:var(--acc)}
#set-head .ttl2{font-family:var(--jp);font-size:9px;letter-spacing:.12em;color:rgba(232,236,242,.34)}
#set-head .sp{flex:1}
#set-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:9px;align-items:start;padding:11px 13px}
.set-grp{border:1px solid rgba(232,236,242,.1);padding:4px 0 6px}
.set-grp>h4{display:flex;align-items:baseline;gap:8px;padding:6px 11px 4px;font-family:var(--saira);font-weight:600;font-size:11px;letter-spacing:.22em;color:var(--acc)}
.set-grp>h4 .jp{font-family:var(--jp);font-weight:400;font-size:9px;letter-spacing:.1em;color:rgba(232,236,242,.38)}
.sc-row{display:flex;align-items:center;gap:8px;padding:2px 11px;font-family:var(--jp);font-size:10.5px;color:rgba(232,236,242,.72)}
.sc-row .lb{flex:1;min-width:0}
.sc-key{flex:none;min-width:70px;height:24px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  color:rgba(232,236,242,.8);border:1px solid rgba(232,236,242,.16);background:rgba(232,236,242,.03)}
.sc-key:hover{border-color:var(--acc-hover-line)}
.sc-key.cap{border-color:var(--acc);color:var(--acc2);animation:nowGlow 1.2s ease-in-out infinite}
.sc-key.unbound{color:rgba(232,236,242,.3)}
.sc-key.fixed{cursor:default;opacity:.65}
.set-in{height:28px;padding:0 8px;border:1px solid rgba(232,236,242,.18);background:rgba(232,236,242,.04);color:var(--ink);font-family:var(--jp);font-size:12px;min-width:0}
.set-in:focus{outline:none;border-color:var(--acc)}
.set-col{width:34px;height:28px;padding:0;border:1px solid rgba(232,236,242,.3);background:none}
#set-note{font-family:var(--jp);font-size:9.5px;letter-spacing:.06em;color:rgba(232,236,242,.42);padding:4px 13px 16px;line-height:1.8}
#set-note b{color:var(--acc2);font-weight:400}

/* ---------- toast・confirm・書き出し中 ---------- */
#toast{position:fixed;left:50%;top:calc(122px + var(--safe-t));transform:translateX(-50%);z-index:110;display:none;max-width:84vw;
  border:1px solid rgba(var(--accRGB),.55);background:rgba(10,12,16,.97);color:var(--ink);box-shadow:var(--acc-glow);
  padding:8px 16px 8px 18px;font-size:10.5px;letter-spacing:.06em;font-family:var(--jp);line-height:1.6}
#toast::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc-pt)}
#toast.show{display:block}
#cf-modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#cf-modal.show{display:flex}
#cf-box{border:1px solid rgba(var(--accRGB),.7);background:rgba(10,12,16,.98);box-shadow:var(--acc-glow);min-width:290px;max-width:470px;padding:20px}
#cf-msg{font-family:var(--jp);font-size:12px;color:var(--ink);line-height:1.85;white-space:pre-line;margin-bottom:18px}
#cf-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#cf-btns .btn.pri{border-color:var(--acc);color:var(--acc2)}
#ex-ov{position:fixed;inset:0;z-index:115;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.66)}
#ex-ov.show{display:flex}
#ex-box{width:min(420px,86vw);border:1px solid rgba(var(--accRGB),.7);background:rgba(10,12,16,.98);padding:18px;display:flex;flex-direction:column;gap:12px}
#ex-msg{font-family:var(--jp);font-size:12px;color:var(--ink)}
#ex-bar{position:relative;height:10px;border:1px solid rgba(232,236,242,.2);overflow:hidden}
#ex-bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc-fill)}
#ex-prog{font-size:10px;letter-spacing:.1em;color:rgba(232,236,242,.55)}

/* ---------- タッチ（iPad）: 押す面を大きく。後勝ちで効かせたいので最後に置く ---------- */
@media (pointer:coarse){
  .btn{height:34px}
  .btn.ico{width:36px}
  .hb{width:32px;height:32px}
  .ph{height:34px}
  .qd-sb{height:32px}
  #tl-head .btn{height:32px}
  #tl-head .btn.ico{width:34px}
  .cel .rh{width:14px}
  #zoom-hud .btn{height:32px}
  #sel-hud .btn{height:34px;padding:0 11px}
  .rrow .ic{width:28px;height:28px}
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <a class="brand" id="brand" href="index.html" title="ランディングページへ（HOME と同じ）">
      <svg viewBox="0 0 120 120" width="28" height="28" fill="none" aria-hidden="true"><g transform="rotate(-8 60 60)"><rect x="20" y="22" width="62" height="74" rx="3" stroke="var(--acc)" stroke-width="9" opacity=".45"></rect><rect x="38" y="30" width="62" height="74" rx="3" stroke="var(--acc)" stroke-width="10"></rect><path d="M52 82 C60 58 72 70 86 48" stroke="var(--acc2)" stroke-width="9" stroke-linecap="round"></path></g></svg>
      <div class="bwrap"><span class="bname">ROUGH</span><span class="bsub">SKETCH · FLIP · SEND</span></div>
    </a>
    <div id="bar-info">
      <b id="i-frame">01/01</b><span id="i-tick">t 0001</span><span class="nm" id="i-name">ROUGH</span><span class="opt" id="i-res">2048×1152</span>
    </div>
    <span class="flex"></span>
    <span id="save-st" title="この端末のブラウザ（IndexedDB）へ自動保存">—</span>
    <button class="btn ico" id="b-undo" title="元に戻す（Ctrl+Z ／ 指2本でタップ）">↶</button>
    <button class="btn ico" id="b-redo" title="やり直す（Ctrl+Shift+Z ／ 指3本でタップ）">↷</button>
    <span class="bsep"></span>
    <button class="btn go" id="b-send" title="ANIMATOR の REF に送る（共有DB経由。ANIMATOR が開いていればその場で入り、開いていなければ次に開いたとき入る）">→ ANIMATOR<span class="t2">&nbsp;REF</span></button>
    <span class="bsep"></span>
    <button class="btn" id="b-save" title="プロジェクトを JSON に保存（PROJECT_v1＋下絵画像。ANIMATOR の IMPORT JSON / REF + JSON でも読める）">⇩ SAVE</button>
    <button class="btn" id="b-open" title="プロジェクト JSON を開く（いまの作業と置き換え）。ANIMATOR の EXPORT JSON も開ける">⇧ OPEN</button>
    <button class="btn ico" id="b-set" title="設定・キー操作の一覧と再割当（,）">⚙</button>
    <button class="btn ico" id="b-fs" title="全画面表示 ON/OFF">⛶</button>
    <a class="btn" id="b-home" href="index.html" title="ランディングページに戻る">HOME</a>
  </header>

  <aside id="dock-l" class="dock"></aside>

  <main id="stage">
    <div id="wrap">
      <canvas id="cv-ref"></canvas>
      <canvas id="cv-onion"></canvas>
      <canvas id="cv-work"></canvas>
      <canvas id="cv-float"></canvas>
    </div>
    <canvas id="cv-ov"></canvas>
    <div id="stage-tag"></div>
    <div id="stage-msg"></div>
    <div id="sel-hud"></div>
    <div id="play-badge">PLAY</div>
    <div id="zoom-hud">
      <button class="btn ico" id="zh-out" title="縮小（−）">−</button>
      <span id="zh-pct">100%</span>
      <button class="btn ico" id="zh-in" title="拡大（＋）">＋</button>
      <button class="btn" id="zh-fit" title="全体表示（F）・もう一度で 100%">FIT</button>
      <button class="btn" id="zh-rot" title="回転を 0° に戻す（指2本でひねると回る・90°ごとに吸い付く）">0°</button>
      <button class="btn ico" id="zh-flip" title="左右反転して見る（X）。描いた絵は反転しない">⇋</button>
    </div>
  </main>

  <aside id="dock-r" class="dock"></aside>
  <section id="dock-b" class="dock"></section>
</div>

<!-- ===== パネル（起動時にレイアウトに従ってドックへ入る。見出しドラッグ／⇱ で浮かせる） ===== -->
<section class="pnl" id="p-tools" data-pid="tools" data-kind="rail">
  <div class="ph"><span class="grip">⠿</span><span class="en">TOOLS</span><span class="jp">道具</span><span class="sp"></span><button class="hb mn" data-act="min" title="畳む／開く">▾</button><button class="hb" data-act="float" title="浮かせる／ドックに戻す">⇱</button></div>
  <div class="pb rail">
    <button class="tool" data-tool="pen" title="PEN ペン（P）&#10;2回押す＝筆圧 ON/OFF&#10;Shift+クリック＝直前の終点から直線／Shift+ドラッグ＝水平・垂直">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21l4-1 11-11-3-3L4 17l-1 4z"></path><path d="M14 6l3 3"></path></svg>
      <span class="lbl">PEN</span><span class="bd" id="bd-pen">P</span></button>
    <button class="tool" data-tool="erase" title="ERASE 消しゴム（E）&#10;2回押す＝筆圧 ON/OFF&#10;長押し＝このコマを全消去（Ctrl+Z で戻せる）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 4l4 4-9 9H7l-3-3 9-9z"></path><path d="M9 17h11"></path></svg>
      <span class="lbl">ERASE</span><span class="bd" id="bd-erase">P</span></button>
    <button class="tool" data-tool="fill" title="FILL 塗り（G）&#10;2回押す＝バケツ ⇄ 投げ縄&#10;長押し＝透明消し ⇄ 塗り&#10;線も塗りも同じ1枚（バケツは同じ色のつながりを塗る）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 11l7-7 7 7-7 7-7-7z"></path><path d="M5 11h14"></path><circle cx="20" cy="18" r="2"></circle></svg>
      <span class="lbl">FILL</span><span class="bd" id="bd-fill">LS</span></button>
    <button class="tool" data-tool="sel" title="SEL 切り貼り（A）&#10;なぞって囲む＝持ち上げる／Shift+ドラッグ＝四角／Alt+ドラッグ＝コピー（元を残す）&#10;中＝移動・隅＝拡縮（Shift で比率）・隅の外＝回転（Shift で15°）&#10;→ ＝ 今のコマはそのまま、次のコマへ持っていく（下絵づくり）&#10;2回押す＝WARP　Enter＝確定　Esc＝取消">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"><rect x="4" y="5" width="16" height="14" rx="1"></rect></svg>
      <span class="lbl">SEL</span><span class="bd ice" id="bd-sel">W</span></button>
    <div class="sep"></div>
    <div class="sizes" id="sizes">
      <button class="sz" data-sz="1" title="1px"><i style="width:2px;height:2px"></i><span>1</span></button>
      <button class="sz" data-sz="2" title="2px"><i style="width:4px;height:4px"></i><span>2</span></button>
      <button class="sz big" data-sz="big" title="太ブラシ：押したまま上下で 3〜60px（右ドラッグでも変わる）"><i id="sz-big-dot"></i><span id="sz-big-v">20</span></button>
    </div>
  </div>
