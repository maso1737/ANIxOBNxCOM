  <div style="display:flex;justify-content:flex-end"><button class="btn" id="ex-cancel">CANCEL</button></div></div></div>
<script>
'use strict';
/* ============================================================
   ROUGH — ラフ原専用の作画アプリ（SPEC_22）
   §1 定数・状態 ／ §2 小物（toast・modal）／ §3 色（パレット・LUT）／ §4 RLE ／ §5 コマ（frames・pix）
   §6 視点（ズーム・パン・回転・反転）／ §7 表示（work・onion・ref・サムネ）／ §8 画素の道具 ／ §9 Undo
   §10 PEN・ERASE・FILL・EYE ／ §11 SEL ／ §12 REF ／ §13 タイムライン ／ §14 パネル（ドック）
   §15 設定・キー ／ §16 入力（ステージ・指・キー）／ §17 保存（IndexedDB）／ §18 書き出し・送る ／ §19 起動
   正準：animator.html（筆圧の式・Shift の連結・バケツ・投げ縄・SEL の箱+rot+warp・指のジェスチャ・空コマ）
         live-plate（SPOTLIGHT・qd-*・数値スクラブ・SEL の移植形）
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const uid = p => (p || 'f') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n, k) => String(n).padStart(k || 3, '0');

/* ============================================================ §1 定数・状態 */
const DB_NAME = 'rough_db_v1', DB_VER = 1;
const LS_PREFS = 'rough_prefs_v1', LS_KEYS = 'rough_keymap_v1', LS_LAYOUT = 'rough_layout_v1';
const MAX_AREA = 4096 * 2304, MAX_SIDE = 8192, MIN_SIDE = 256;
const DEF_W = 2048, DEF_H = 1152;           // ANIMATOR の既定と同じ＝REF に送ると原寸・中央でぴたり重なる
const HIST_MAX = 120, HIST_BYTES = 240 * 1024 * 1024;
const THUMB_H = 46;
const IDX_WHITE = 11, IDX_ROUGH = 12, IDX_NOTE = 13, NCOL = 14;
const ROUGH_DEF = '#A8D8FF', NOTE_DEF = '#FFB060';   // ANIMATOR の下書（うすい水色）・指示（オレンジ）と同じ
const KEY_DBL_MS = 320, HOLD_MS = 600;
const HARNESS = new URLSearchParams(location.search).get('harness') === '1';

const P = {   // 端末に覚えておく好み（localStorage）
  tool: 'pen', color: 1,
  sz: { pen: { sel: 2, big: 20 }, erase: { sel: 'big', big: 30 } },
  pressPen: true, pressErase: false, curve: 'lin', psm: 'ema+',
  stab: { mode: 'off', avg: 0.5, pull: 0.3 },
  fillMode: 'bucket', fillErase: false,
  selRough: true,                              // 貼る／次のコマへ持っていくとき下書の色にする
  onion: { on: true, prev: 1, next: 1, op: 50, cPrev: '#FF4F6A', cNext: '#3FD0FF' },
  tone: 0, toneShape: { t1: { pitch: 8, cov: 6 }, t2: { pitch: 4, cov: 40 } },
  paper: 100, colRough: ROUGH_DEF, colNote: NOTE_DEF, hideRough: false, hideNote: false,
  out: { bg: 'alpha', rough: true, note: true, ref: false, seq: 'tick' },
  refShow: true, refOp: 60, refMono: false,
  ppt: 22, loop: true, fps: 24, fingerDraw: false,
};
(function loadPrefs(){
  try{
    const o = JSON.parse(localStorage.getItem(LS_PREFS) || 'null');
    if(!o || typeof o !== 'object') return;
    const merge = (dst, src) => { for(const k in dst){ if(src[k] === undefined) continue;
      if(dst[k] && typeof dst[k] === 'object' && !Array.isArray(dst[k])) merge(dst[k], src[k] || {});
      else if(typeof src[k] === typeof dst[k]) dst[k] = src[k]; } };
    merge(P, o);
  }catch(e){}
  if(P.tool === 'eye') P.tool = 'pen';
  P.fillErase = false;
})();
let _prefT = 0;
function savePrefs(){ clearTimeout(_prefT); _prefT = setTimeout(() => { try{ if(!HARNESS) localStorage.setItem(LS_PREFS, JSON.stringify(P)); }catch(e){} }, 250); }

const S = {   // いまの作業（プロジェクト）と「いまどこを見ているか」
  pid: uid('r'), name: 'ROUGH', W: DEF_W, H: DEF_H,
  frames: [],          // [{ id, kind:'draw'|'empty', dur }]
  cur: 0, tick: 0,
  playing: false,
  view: { z: 0.4, tx: 0, ty: 0, rot: 0, flip: false, fit: true },
  refs: [], refSel: null, refMove: false,
};
const pix = new Map();      // frameId → Uint8Array(W*H)（色番号）
const thumbs = new Map();   // frameId → canvas

/* ============================================================ §2 小物 */
let _toastT = 0;
function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastT); _toastT = setTimeout(() => t.classList.remove('show'), ms || 2600);
}
/* アプリ内モーダル（native の alert/confirm は使わない）。Enter＝主ボタン・Esc＝最後の値（キャンセル） */
let gModalOpen = false;
function modal(msg, buttons){
  return new Promise(res => {
    const ov = $('#cf-modal'), box = $('#cf-btns');
    $('#cf-msg').textContent = msg;
    box.innerHTML = '';
    const bs = buttons || [{ label: 'OK', value: true, pri: true }];
    const done = v => { ov.classList.remove('show'); document.removeEventListener('keydown', onKey, true); gModalOpen = false; res(v); };
    const onKey = e => {
      e.stopPropagation();
      if(e.key === 'Escape'){ e.preventDefault(); done(bs[0].cancel !== undefined ? bs[0].cancel : (bs.find(b => b.esc) || {}).value); }
      else if(e.key === 'Enter'){ e.preventDefault(); done((bs.find(b => b.pri) || bs[bs.length - 1]).value); }
    };
    bs.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn' + (b.pri ? ' pri' : '') + (b.del ? ' del' : '');
      el.textContent = b.label;
      el.onclick = () => done(b.value);
      box.appendChild(el);
    });
    gModalOpen = true;
    document.addEventListener('keydown', onKey, true);
    ov.classList.add('show');
  });
}
const confirmBox = (msg, ok) => modal(msg, [{ label: 'CANCEL', value: false, esc: true }, { label: ok || 'OK', value: true, pri: true }]);
const alertBox = msg => modal(msg, [{ label: 'OK', value: true, pri: true, esc: true }]);

/* 押し方（SPEC_17）：単押し＝tap ／ 2回目（KEY_DBL_MS 以内）＝dbl ／ 長押し（HOLD_MS）＝hold。
   iPad の dblclick は当てにならないので pointer で自前に数える（ペンでも指でも同じに効く） */
function gestureButton(el, h){
  let t0 = 0, last = 0, timer = 0, held = false;
  el.addEventListener('pointerdown', e => {
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    held = false; t0 = performance.now();
    clearTimeout(timer);
    if(h.hold) timer = setTimeout(() => { held = true; h.hold(); }, HOLD_MS);
  });
  const cancel = () => clearTimeout(timer);
  el.addEventListener('pointerleave', cancel);
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('pointerup', e => {
    clearTimeout(timer);
    if(held){ held = false; last = 0; return; }
    const now = performance.now();
    if(h.dbl && now - last < KEY_DBL_MS){ last = 0; h.dbl(e); return; }
    last = now;
    if(h.tap) h.tap(e);
  });
  el.addEventListener('click', e => e.preventDefault());
}

/* 数値スクラブ（左右ドラッグ／Wクリックで直接入力）。SCR[key] = { get, set(v), min, max, step, px, fmt, done } */
const SCR = {};
function bindScrub(root){
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest && e.target.closest('[data-scr]');
    if(!el || !root.contains(el) || el.querySelector('input')) return;
    const def = SCR[el.dataset.scr];
    if(!def) return;
    e.preventDefault(); e.stopPropagation();
    const x0 = e.clientX, v0 = def.get();
    let moved = false;
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const vEl = el.querySelector('.v');
    const mv = ev => {
      const dx = ev.clientX - x0;
      if(!moved && Math.abs(dx) < 3) return;
      moved = true;
      const k = ev.shiftKey ? 10 : 1;
      const v = clamp(v0 + Math.round(dx / (def.px || 4)) * (def.step || 1) * k, def.min, def.max);
      def.set(v, true);
      if(vEl) vEl.textContent = def.fmt ? def.fmt(def.get()) : def.get();
    };
    const up = () => {
      el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      if(moved){ if(def.done) def.done(); return; }
      const now = performance.now();
      if(now - (el._lt || 0) < 400){ el._lt = 0; scrubInput(el, def); } else el._lt = now;
    };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}
function scrubInput(el, def){
  const vEl = el.querySelector('.v');
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'decimal'; inp.value = def.get();
  vEl.style.display = 'none';
  el.appendChild(inp); inp.focus(); inp.select();
  const fin = ok => {
    if(!inp.parentNode) return;
    if(ok){ const v = parseFloat(inp.value); if(isFinite(v)) def.set(clamp(Math.round(v / (def.step || 1)) * (def.step || 1), def.min, def.max)); }
    inp.remove(); vEl.style.display = '';
    vEl.textContent = def.fmt ? def.fmt(def.get()) : def.get();
    if(ok && def.done) def.done();
  };
  inp.addEventListener('keydown', ev => { ev.stopPropagation(); if(ev.key === 'Enter') fin(true); else if(ev.key === 'Escape') fin(false); });
  inp.addEventListener('blur', () => fin(true));
}
function scrubHTML(key, label, unit){
  const d = SCR[key], v = d ? (d.fmt ? d.fmt(d.get()) : d.get()) : '';
  return '<span class="scr" data-scr="' + key + '">' + (label ? '<span class="k">' + label + '</span>' : '') + '<span class="v">' + esc(v) + '</span><span class="u">' + (unit || '') + '</span></span>';
}
function refreshScrubs(root){
  (root || document).querySelectorAll('[data-scr]').forEach(el => {
    const d = SCR[el.dataset.scr], v = el.querySelector('.v');
    if(d && v && !el.querySelector('input')) v.textContent = d.fmt ? d.fmt(d.get()) : d.get();
  });
}

/* ============================================================ §3 色（13色だけ。番号で持ち、表示のときだけ RGBA にする） */
const GRAY_HEX = [];
for(let i = 0; i <= 10; i++){ const v = Math.round(255 * i / 10).toString(16).padStart(2, '0').toUpperCase(); GRAY_HEX.push('#' + v + v + v); }
function colHex(idx){
  if(idx >= 1 && idx <= 11) return GRAY_HEX[idx - 1];
  if(idx === IDX_ROUGH) return P.colRough;
  if(idx === IDX_NOTE) return P.colNote;
  return null;
}
function colName(idx){
  if(idx === 1) return '黒';
  if(idx === IDX_WHITE) return '白';
  if(idx >= 2 && idx <= 10) return ((idx - 1) * 10) + '%';
  if(idx === IDX_ROUGH) return '下書';
  if(idx === IDX_NOTE) return '指示';
  return '—';
}
function hexRgb(hex){
  const h = String(hex || '#000').replace('#', '');
  return [parseInt(h.substr(0, 2), 16) || 0, parseInt(h.substr(2, 2), 16) || 0, parseInt(h.substr(4, 2), 16) || 0];
}
const pack32 = (r, g, b, a) => ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;   // little-endian の RGBA
/* LUT：opt.rough / opt.note が false の色は透明（隠す・書き出さない） */
function makeLUT(opt){
  const L = new Uint32Array(256);
  for(let i = 1; i < NCOL; i++){
    if(i === IDX_ROUGH && opt && opt.rough === false) continue;
    if(i === IDX_NOTE && opt && opt.note === false) continue;
    const c = hexRgb(colHex(i));
    L[i] = pack32(c[0], c[1], c[2], 255);
  }
  return L;
}
let LUT = makeLUT({ rough: !P.hideRough, note: !P.hideNote });
function rebuildLUT(){ LUT = makeLUT({ rough: !P.hideRough, note: !P.hideNote }); }
/* 取り込んだ画像の色 → いちばん近い番号（α<128 は透明）。13色との距離で選ぶ */
function quantizer(){
  const cols = [];
  for(let i = 1; i < NCOL; i++) cols.push([i].concat(hexRgb(colHex(i))));
  const cache = new Map();
  return (r, g, b, a) => {
    if(a < 128) return 0;
    const key = (r << 16) | (g << 8) | b;
    let v = cache.get(key);
    if(v !== undefined) return v;
    let best = 1, bd = 1e9;
    for(const c of cols){ const d = (r - c[1]) ** 2 * 3 + (g - c[2]) ** 2 * 4 + (b - c[3]) ** 2 * 2; if(d < bd){ bd = d; best = c[0]; } }
    cache.set(key, best);
    return best;
  };
}

/* ============================================================ §4 RLE（保存用。線画はほとんど透明なので 2K で数十 KB になる）
   形式：[値, 長さ(可変長 7bit)] の並び。 */
function rleEncode(a){
  const out = []; let i = 0; const n = a.length;
  while(i < n){
    const v = a[i]; let j = i + 1;
    while(j < n && a[j] === v) j++;
    let len = j - i;
    out.push(v);
    while(len >= 128){ out.push((len & 127) | 128); len >>>= 7; }
    out.push(len);
    i = j;
  }
  return Uint8Array.from(out);
}
function rleDecode(r, n){
  const a = new Uint8Array(n); let p = 0, i = 0;
  while(i < r.length && p < n){
    const v = r[i++]; let len = 0, sh = 0, b;
    do{ b = r[i++]; len |= (b & 127) << sh; sh += 7; }while(b & 128);
    if(v) a.fill(v, p, Math.min(n, p + len));
    p += len;
  }
  return a;
}

/* ============================================================ §5 コマ（frames は「並びと尺」だけ。画素は pix に id で） */
function totalTicks(){ let t = 0; for(const f of S.frames) t += f.dur; return t; }
function frameStart(i){ let t = 0; for(let k = 0; k < i; k++) t += S.frames[k].dur; return t; }
function frameAt(tick){
  let t = 0;
  for(let i = 0; i < S.frames.length; i++){ t += S.frames[i].dur; if(tick < t) return i; }
  return S.frames.length - 1;
}
function curFrame(){ return S.frames[S.cur] || null; }
function curBuf(){ const f = curFrame(); return f && f.kind === 'draw' ? pix.get(f.id) : null; }
function newBuf(){ return new Uint8Array(S.W * S.H); }
function blankFrame(dur){ const f = { id: uid('f'), kind: 'draw', dur: Math.max(1, dur | 0 || 1) }; pix.set(f.id, newBuf()); return f; }
/* 空コマ → 絵のコマ。★ 必ず新しい id にする（同じ id の画素を白紙で上書きすると、
   「絵のコマ→空コマ」の Undo で戻したとき元の絵が消えている＝Undo の控えは id で画素を指しているため） */
function makeDraw(f){ f.id = uid('f'); f.kind = 'draw'; pix.set(f.id, newBuf()); return f; }
/* 前後の「絵のコマ」（空コマは飛ばす） */
function drawNeighbors(i, dir, n){
  const out = [];
  for(let k = i + dir; k >= 0 && k < S.frames.length && out.length < n; k += dir) if(S.frames[k].kind === 'draw') out.push(S.frames[k]);
  return out;
}
/* 下絵にする（白は捨てる＝修正の白が水色の染みにならない・ほかは全部下書の色） */
function toRough(src){
  const d = new Uint8Array(src.length);
  for(let i = 0; i < src.length; i++){ const v = src[i]; if(v && v !== IDX_WHITE) d[i] = IDX_ROUGH; }
  return d;
}

/* ============================================================ §6 視点（screen = T + R·S·(p − C)。CSS の transform と同じ式で座標も換算する） */
let stageEl, wrapEl, cvWork, cxWork, cvOnion, cxOnion, cvRef, cxRef, cvFloat, cxFloat, cvOv, cxOv;
let SW = 1, SH = 1, DPR = 1;
function viewMat(){
  const v = S.view, a = v.rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), fx = v.flip ? -1 : 1;
  return { a: c * v.z * fx, b: s * v.z * fx, c: -s * v.z, d: c * v.z, e: v.tx, f: v.ty };   // 列ベクトル：x' = a·x + c·y + e
}
function toScreen(px, py){
  const m = viewMat(), x = px - S.W / 2, y = py - S.H / 2;
  return { x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f };
}
function toCanvas(sx, sy){
  const v = S.view, a = -v.rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const dx = sx - v.tx, dy = sy - v.ty;
  const rx = dx * c - dy * s, ry = dx * s + dy * c;
  return { x: rx / (v.z * (v.flip ? -1 : 1)) + S.W / 2, y: ry / v.z + S.H / 2 };
}
function evStage(e){ const r = stageEl.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function applyView(){
  const m = viewMat();
  const cx = S.W / 2, cy = S.H / 2;
  const e = m.e - (m.a * cx + m.c * cy), f = m.f - (m.b * cx + m.d * cy);
  wrapEl.style.transform = 'matrix(' + [m.a, m.b, m.c, m.d, e, f].map(n => +n.toFixed(5)).join(',') + ')';
  wrapEl.classList.toggle('px', S.view.z >= 1.5);
  $('#zh-pct').textContent = Math.round(S.view.z * 100) + '%';
  $('#zh-rot').textContent = Math.round(S.view.rot) + '°';
  $('#zh-flip').classList.toggle('on', S.view.flip);
  drawOv();
}
function fitScale(){ return Math.max(0.02, Math.min((SW - 48) / S.W, (SH - 48) / S.H)); }
function fitView(){ const v = S.view; v.z = fitScale(); v.tx = SW / 2; v.ty = SH / 2; v.fit = true; applyView(); }
function zoomAt(z, sx, sy){
  const v = S.view, nz = clamp(z, 0.03, 16);
  const p = toCanvas(sx, sy);
  v.z = nz; v.fit = false;
  const q = toScreen(p.x, p.y);   // 掴んだ点が指（カーソル）の下に居続けるよう T をずらす
  v.tx += sx - q.x; v.ty += sy - q.y;
  applyView();
}
/* ＋／−は 100% と FIT に必ず立ち寄る（animator zoomStep と同じ考え：等倍を素通りしない） */
function zoomStep(dir){
  const v = S.view, f = fitScale(), stops = [1, f];
  let nz = dir > 0 ? v.z * 1.25 : v.z / 1.25;
  for(const s of stops){ if(dir > 0 && v.z < s - 1e-6 && nz > s + 1e-6) nz = s; if(dir < 0 && v.z > s + 1e-6 && nz < s - 1e-6) nz = s; }
  if(Math.abs(nz - f) < 1e-6){ fitView(); return; }
  zoomAt(nz, SW / 2, SH / 2);
}
function fitAction(){
  if(S.view.fit){ zoomAt(1, SW / 2, SH / 2); toast('100%'); }
  else fitView();
}
function setRot(deg){
  const v = S.view, c = toCanvas(SW / 2, SH / 2);
  v.rot = ((deg % 360) + 540) % 360 - 180;
  if(v.rot === -180) v.rot = 180;
  const q = toScreen(c.x, c.y); v.tx += SW / 2 - q.x; v.ty += SH / 2 - q.y;
  applyView();
}
function toggleFlip(){
  const v = S.view, c = toCanvas(SW / 2, SH / 2);
  v.flip = !v.flip;
  const q = toScreen(c.x, c.y); v.tx += SW / 2 - q.x; v.ty += SH / 2 - q.y;
  applyView();
  toast(v.flip ? '左右反転して表示（描いた絵は反転しません）' : '反転 OFF');
}
function onStageResize(){
  const r = stageEl.getBoundingClientRect();
  const ow = SW, oh = SH;
  SW = Math.max(1, r.width); SH = Math.max(1, r.height);
  DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  cvOv.width = Math.round(SW * DPR); cvOv.height = Math.round(SH * DPR);
  if(S.view.fit) fitView();
  else { S.view.tx += (SW - ow) / 2; S.view.ty += (SH - oh) / 2; applyView(); }
}

/* ============================================================ §7 表示
   work … いまのコマ（番号 → LUT → RGBA）。描いた矩形だけ rAF で putImageData（dirty）
   onion … 前後のコマを色付きで透かす（番号から直接作る）
   ref … 下絵画像のコラージュ（CSS の opacity / grayscale で全体の濃さ・モノクロ）
   ov … 画面座標の手すり（筆の輪・投げ縄・SEL の枠・REF の枠）。拡大しても線が太らない */
let dirty = null, rqDirty = 0, fullImg = null;
function setupCanvas(){
  for(const c of [cvWork, cvOnion, cvRef, cvFloat]){ c.width = S.W; c.height = S.H; }
  wrapEl.style.width = S.W + 'px'; wrapEl.style.height = S.H + 'px';
  fullImg = new ImageData(S.W, S.H);
  cxWork.imageSmoothingEnabled = false; cxFloat.imageSmoothingEnabled = false;
  applyPaper();
}
function applyPaper(){
  const v = Math.round(255 * P.paper / 100);
  wrapEl.style.background = 'rgb(' + v + ',' + v + ',' + v + ')';
}
function paperHex(){ const v = Math.round(255 * P.paper / 100).toString(16).padStart(2, '0'); return '#' + v + v + v; }
function markDirty(x0, y0, x1, y1){
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  x1 = Math.min(S.W, Math.ceil(x1)); y1 = Math.min(S.H, Math.ceil(y1));
  if(x1 <= x0 || y1 <= y0) return;
  if(!dirty) dirty = { x0, y0, x1, y1 };
  else { dirty.x0 = Math.min(dirty.x0, x0); dirty.y0 = Math.min(dirty.y0, y0); dirty.x1 = Math.max(dirty.x1, x1); dirty.y1 = Math.max(dirty.y1, y1); }
  if(!rqDirty) rqDirty = requestAnimationFrame(flushDirty);
}
function flushDirty(){
  rqDirty = 0;
  const d = dirty; dirty = null;
  if(!d) return;
  const buf = curBuf();
  if(!buf){ cxWork.clearRect(d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0); return; }
  paintRect(cxWork, buf, d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0, LUT);
}
/* 番号の矩形 → RGBA → putImageData（全面は使い回しの ImageData） */
function paintRect(ctx, buf, x, y, w, h, lut){
  const W = S.W;
  const img = (w === S.W && h === S.H) ? fullImg : new ImageData(w, h);
  const o = new Uint32Array(img.data.buffer);
  for(let r = 0; r < h; r++){
    const s = (y + r) * W + x, q = r * w;
    for(let k = 0; k < w; k++) o[q + k] = lut[buf[s + k]];
  }
  ctx.putImageData(img, x, y);
}
function renderWork(){
  if(rqDirty){ cancelAnimationFrame(rqDirty); rqDirty = 0; }
  dirty = null;
  const buf = curBuf();
  if(buf) paintRect(cxWork, buf, 0, 0, S.W, S.H, LUT);
  else cxWork.clearRect(0, 0, S.W, S.H);
}
/* オニオン：近い順に 0.55^k で薄く。白（修正）は透かさない */
let rqOnion = 0;
function renderOnionQ(){ if(!rqOnion) rqOnion = requestAnimationFrame(() => { rqOnion = 0; renderOnion(); }); }
function renderOnion(){
  const O = P.onion;
  cvOnion.style.display = (O.on && !S.playing) ? '' : 'none';
  if(!O.on || S.playing){ return; }
  const d = fullImg.data;
  d.fill(0);
  const op = O.op / 100;
  const layers = [];
  drawNeighbors(S.cur, -1, O.prev).forEach((f, k) => layers.push({ f, k, col: hexRgb(O.cPrev) }));
  drawNeighbors(S.cur, 1, O.next).forEach((f, k) => layers.push({ f, k, col: hexRgb(O.cNext) }));
  layers.sort((a, b) => b.k - a.k);   // 遠いものから重ねる＝近いものが上
  for(const L of layers){
    const buf = pix.get(L.f.id);
    if(!buf) continue;
    const a = op * Math.pow(0.55, L.k), [r, g, b] = L.col;
    for(let i = 0, n = buf.length; i < n; i++){
      const v = buf[i];
      if(!v || v === IDX_WHITE) continue;
      const j = i << 2, da = d[j + 3] / 255, oa = a + da * (1 - a);
      d[j] = (r * a + d[j] * da * (1 - a)) / oa;
      d[j + 1] = (g * a + d[j + 1] * da * (1 - a)) / oa;
      d[j + 2] = (b * a + d[j + 2] * da * (1 - a)) / oa;
      d[j + 3] = oa * 255;
    }
  }
  cxOnion.putImageData(fullImg, 0, 0);
}
/* サムネ（タイムライン）：箱の中に1点でも線があれば濃く出す＝縮めても細い線が消えない */
function thumbOf(id){
  let c = thumbs.get(id);
  if(!c){ c = document.createElement('canvas'); thumbs.set(id, c); }
  return c;
}
function updateThumb(f){
  if(!f || f.kind !== 'draw') return;
  const buf = pix.get(f.id); if(!buf) return;
  const c = thumbOf(f.id), th = THUMB_H, tw = Math.max(8, Math.round(S.W / S.H * th));
  if(c.width !== tw || c.height !== th){ c.width = tw; c.height = th; }
  const g = c.getContext('2d'), img = g.createImageData(tw, th), o = img.data;
  const W = S.W, H = S.H, sx = W / tw, sy = H / th;
  const st = Math.max(1, Math.floor(Math.min(sx, sy) / 4));   // 箱の中を st 刻みで見る（速さとの釣り合い）
  const cols = []; for(let i = 0; i < NCOL; i++) cols.push(hexRgb(colHex(i) || '#000'));
  for(let ty = 0; ty < th; ty++){
    const y0 = Math.floor(ty * sy), y1 = Math.min(H, Math.floor((ty + 1) * sy));
    for(let tx = 0; tx < tw; tx++){
      const x0 = Math.floor(tx * sx), x1 = Math.min(W, Math.floor((tx + 1) * sx));
      let n = 0, hit = 0, r = 0, gg = 0, b = 0, dark = 999;
      for(let y = y0; y < y1; y += st){
        const row = y * W;
        for(let x = x0; x < x1; x += st){
          const v = buf[row + x]; n++;
          if(!v) continue;
          if(v === IDX_ROUGH && P.hideRough) continue;
          if(v === IDX_NOTE && P.hideNote) continue;
          hit++;
          const cc = cols[v]; r += cc[0]; gg += cc[1]; b += cc[2];
          const L = v <= 11 ? v : 6; if(L < dark) dark = L;
        }
      }
      const q = (ty * tw + tx) * 4;
      if(hit){
        const cov = hit / n;
        o[q] = r / hit; o[q + 1] = gg / hit; o[q + 2] = b / hit;
        o[q + 3] = Math.min(255, 70 + cov * 900);
      }
    }
  }
  g.putImageData(img, 0, 0);
}
let thumbQ = new Set(), rqThumb = 0;
function thumbLater(f){ if(!f) return; thumbQ.add(f.id); if(!rqThumb) rqThumb = setTimeout(flushThumbs, 160); }
function flushThumbs(){
  rqThumb = 0;
  for(const id of thumbQ){ const f = S.frames.find(x => x.id === id); if(f) updateThumb(f); }
  thumbQ.clear();
}

/* ============================================================ §8 画素の道具（番号の配列に直接。AA なし）
   正準：animator fillCircleRows / bresenham / drawDot(1px・2px・半径) / floodFill / lassoFillPolygon / selPolyMask */
function fillCircleRows(x, y, r, row){
  const ir = Math.max(1, Math.round(r)), r2 = r * r;
  for(let dy = -ir; dy < ir; dy++){
    const ddy = dy + 0.5, s2 = r2 - ddy * ddy;
    if(s2 <= 0) continue;
    const s = Math.sqrt(s2);
    const x0 = Math.max(-ir, Math.ceil(-s - 0.5)), x1 = Math.min(ir - 1, Math.floor(s - 0.5));
    if(x1 >= x0) row(x + x0, y + dy, x1 - x0 + 1);
  }
}
function bresenham(x0, y0, x1, y1, visit){
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  const steps = Math.max(dx, dy) || 1;
  let err = dx - dy, x = x0, y = y0, n = 0;
  for(;;){
    visit(x, y, n / steps);
    if(x === x1 && y === y1) break;
    const e2 = 2 * err;
    if(e2 > -dy){ err -= dy; x += sx; }
    if(e2 < dx){ err += dx; y += sy; }
    n++;
  }
}
/* いま描いている1手の範囲（Undo の矩形・dirty の矩形） */
/* スクリーントーン（ドット2種・animator の SCREEN TONE と同じ作り）。T1＝8px/6%（薄いアタリ）・T2＝4px/40%（濃い網）。
   網点は紙の原点に固定（塗り足しても点がずれずに繋がる）。点の色はいまの色。PEN・バケツ・投げ縄塗りに効く。
   描いた結果は普通の画素（色番号）として焼ける＝書き出し・ANIMATOR へはそのまま。 */
const TONE_LIMIT = { pitch: [4, 48], cov: [1, 95] };
let gToneMask = null;
function buildTone(){
  if(!P.tone){ gToneMask = null; return; }
  const sh = P.toneShape[P.tone === 1 ? 't1' : 't2'];
  const T = clamp(sh.pitch | 0, TONE_LIMIT.pitch[0], TONE_LIMIT.pitch[1]);
  const r2 = (clamp(sh.cov, TONE_LIMIT.cov[0], TONE_LIMIT.cov[1]) / 100 * T * T) / (2 * Math.PI);
  const centers = [[0, 0], [T, 0], [0, T], [T, T], [T / 2, T / 2]];
  const m = new Uint8Array(T * T);
  for(let y = 0; y < T; y++) for(let x = 0; x < T; x++){
    const px = x + 0.5, py = y + 0.5;
    for(const [cx0, cy0] of centers){ const dx = px - cx0, dy = py - cy0; if(dx * dx + dy * dy <= r2){ m[y * T + x] = 1; break; } }
  }
  gToneMask = { T, m };
}
const toneOn = (x, y) => { const t = gToneMask, T = t.T; return t.m[(y % T) * T + (x % T)] === 1; };
const PX = { buf: null, W: 0, H: 0, v: 1, bb: null, tone: false };
function pxTarget(buf, v){ PX.buf = buf; PX.W = S.W; PX.H = S.H; PX.v = v; PX.tone = !!(v && gToneMask); }
function bbGrow(x0, y0, x1, y1){
  const b = PX.bb;
  if(!b){ PX.bb = { x0, y0, x1, y1 }; return; }
  if(x0 < b.x0) b.x0 = x0; if(y0 < b.y0) b.y0 = y0; if(x1 > b.x1) b.x1 = x1; if(y1 > b.y1) b.y1 = y1;
}
function span(x, y, w){
  const W = PX.W;
  if(y < 0 || y >= PX.H) return;
  const a = Math.max(0, x), b = Math.min(W, x + w);
  if(b <= a) return;
  if(PX.tone){ const row = y * W; for(let x2 = a; x2 < b; x2++) if(toneOn(x2, y)) PX.buf[row + x2] = PX.v; return; }
  PX.buf.fill(PX.v, y * W + a, y * W + b);
}
function dotR(x, y, r){
  x = Math.round(x); y = Math.round(y);
  if(r <= 0.7){ span(x, y, 1); bbGrow(x, y, x + 1, y + 1); markDirty(x, y, x + 1, y + 1); return; }
  fillCircleRows(x, y, r, span);
  const R = Math.ceil(r) + 1;
  bbGrow(x - R, y - R, x + R, y + R); markDirty(x - R, y - R, x + R, y + R);
}
function dotS(x, y, size){
  x = Math.round(x); y = Math.round(y);
  if(size === 1){ span(x, y, 1); bbGrow(x, y, x + 1, y + 1); markDirty(x, y, x + 1, y + 1); return; }
  if(size === 2){ span(x, y, 2); span(x, y + 1, 2); bbGrow(x, y, x + 2, y + 2); markDirty(x, y, x + 2, y + 2); return; }
  dotR(x, y, size / 2);
}
function lineS(x0, y0, x1, y1, size){ bresenham(x0, y0, x1, y1, (x, y) => dotS(x, y, size)); }
function lineR(x0, y0, x1, y1, r0, r1){ bresenham(x0, y0, x1, y1, (x, y, t) => dotR(x, y, r0 + (r1 - r0) * t)); }

/* バケツ：押した画素と同じ番号のつながりを v に（v=0 で透明に）。戻り値＝塗った矩形 or null */
function floodFill(buf, sx, sy, v){
  const W = S.W, H = S.H;
  sx = Math.floor(sx); sy = Math.floor(sy);
  if(sx < 0 || sy < 0 || sx >= W || sy >= H) return null;
  const t = buf[sy * W + sx];
  const tone = !!(v && gToneMask);
  if(t === v && !tone) return null;
  if(tone) return floodTone(buf, sx, sy, v, t);
  let bx0 = W, by0 = H, bx1 = -1, by1 = -1;
  const stack = [sx, sy];
  while(stack.length){
    const y = stack.pop(), x = stack.pop();
    let lx = x, row = y * W;
    while(lx >= 0 && buf[row + lx] === t) lx--;
    lx++;
    let up = false, dn = false;
    if(lx < bx0) bx0 = lx;
    while(lx < W && buf[row + lx] === t){
      buf[row + lx] = v;
      if(y > 0){ if(buf[row - W + lx] === t){ if(!up){ stack.push(lx, y - 1); up = true; } } else up = false; }
      if(y < H - 1){ if(buf[row + W + lx] === t){ if(!dn){ stack.push(lx, y + 1); dn = true; } } else dn = false; }
      lx++;
    }
    if(lx - 1 > bx1) bx1 = lx - 1;
    if(y < by0) by0 = y; if(y > by1) by1 = y;
  }
  if(bx1 < 0) return null;
  return { x0: bx0, y0: by0, x1: bx1 + 1, y1: by1 + 1 };
}
/* トーンのバケツ：同じ番号のつながりを先に囲ってから、網点の所だけ塗る（塗らない所も元の番号のまま残るので visited で止める） */
function floodTone(buf, sx, sy, v, t){
  const W = S.W, H = S.H, seen = new Uint8Array(W * H);
  let bx0 = W, by0 = H, bx1 = -1, by1 = -1, any = false;
  const stack = [sx, sy];
  while(stack.length){
    const y = stack.pop(), x = stack.pop(), i = y * W + x;
    if(x < 0 || y < 0 || x >= W || y >= H || seen[i] || buf[i] !== t) continue;
    let lx = x; while(lx > 0 && !seen[y * W + lx - 1] && buf[y * W + lx - 1] === t) lx--;
    let rx = x; while(rx < W - 1 && !seen[y * W + rx + 1] && buf[y * W + rx + 1] === t) rx++;
    for(let k = lx; k <= rx; k++){
      const j = y * W + k; seen[j] = 1;
      if(toneOn(k, y) && buf[j] !== v){ buf[j] = v; any = true; }
      if(y > 0) stack.push(k, y - 1);
      if(y < H - 1) stack.push(k, y + 1);
    }
    if(lx < bx0) bx0 = lx; if(rx > bx1) bx1 = rx; if(y < by0) by0 = y; if(y > by1) by1 = y;
  }
  return any ? { x0: bx0, y0: by0, x1: bx1 + 1, y1: by1 + 1 } : null;
}
function bboxOf(pts){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for(const p of pts){ if(p.x < x0) x0 = p.x; if(p.x > x1) x1 = p.x; if(p.y < y0) y0 = p.y; if(p.y > y1) y1 = p.y; }
  return { x0: Math.max(0, Math.floor(x0)), y0: Math.max(0, Math.floor(y0)), x1: Math.min(S.W - 1, Math.ceil(x1)), y1: Math.min(S.H - 1, Math.ceil(y1)) };
}
/* 多角形の内側（画素の中心で偶奇判定）を w×h のマスクで */
function polyMask(pts, x0, y0, w, h){
  const m = new Uint8Array(w * h), n = pts.length, xs = [];
  for(let y = 0; y < h; y++){
    const yc = y0 + y + 0.5;
    xs.length = 0;
    for(let i = 0, j = n - 1; i < n; j = i++){
      const yi = pts[i].y, yj = pts[j].y;
      if((yi > yc) !== (yj > yc)) xs.push(pts[i].x + (yc - yi) / (yj - yi) * (pts[j].x - pts[i].x));
    }
    if(xs.length < 2) continue;
    xs.sort((a, b) => a - b);
    for(let k = 0; k + 1 < xs.length; k += 2){
      const a = Math.max(0, Math.ceil(xs[k] - 0.5) - x0), b = Math.min(w - 1, Math.floor(xs[k + 1] - 0.5) - x0);
      for(let x = a; x <= b; x++) m[y * w + x] = 1;
    }
  }
  return m;
}
function lassoFill(buf, pts, v){
  if(!pts || pts.length < 3) return null;
  const b = bboxOf(pts);
  if(b.x0 > b.x1 || b.y0 > b.y1) return null;
  const w = b.x1 - b.x0 + 1, h = b.y1 - b.y0 + 1;
  const m = polyMask(pts, b.x0, b.y0, w, h);
  let any = false;
  for(let y = 0; y < h; y++){
    const row = (b.y0 + y) * S.W + b.x0, q = y * w;
    const tone = !!(v && gToneMask);
    for(let x = 0; x < w; x++) if(m[q + x] && buf[row + x] !== v && (!tone || toneOn(b.x0 + x, b.y0 + y))){ buf[row + x] = v; any = true; }
  }
  return any ? { x0: b.x0, y0: b.y0, x1: b.x1 + 1, y1: b.y1 + 1 } : null;
}

/* ============================================================ §9 Undo（1本の時系列）
   px … 画素の矩形（前／後）。どのコマでも戻せる（違うコマならそのコマへ移ってから戻す）
   tl … コマの並びと尺（画素は pix に id で残っているので並びだけ控える） */
const HIST = { undo: [], redo: [], bytes: 0 };
let snapBuf = null, snapId = null;   // 1手の「前」の控え（全面コピー1枚を使い回す）
function pxBegin(f){
  if(!f || f.kind !== 'draw') return false;
  const buf = pix.get(f.id);
  if(!snapBuf || snapBuf.length !== buf.length) snapBuf = new Uint8Array(buf.length);
  snapBuf.set(buf);
  snapId = f.id;
  PX.bb = null;
  return true;
}
function pxEnd(label, bbExtra){
  const id = snapId; snapId = null;
  if(!id) return false;
  let b = PX.bb; PX.bb = null;
  if(bbExtra){ b = b ? { x0: Math.min(b.x0, bbExtra.x0), y0: Math.min(b.y0, bbExtra.y0), x1: Math.max(b.x1, bbExtra.x1), y1: Math.max(b.y1, bbExtra.y1) } : bbExtra; }
  if(!b) return false;
  const x0 = clamp(b.x0, 0, S.W), y0 = clamp(b.y0, 0, S.H), x1 = clamp(b.x1, 0, S.W), y1 = clamp(b.y1, 0, S.H);
  const w = x1 - x0, h = y1 - y0;
  if(w <= 0 || h <= 0) return false;
  const buf = pix.get(id);
  const a = new Uint8Array(w * h), bb = new Uint8Array(w * h);
  let diff = false;
  for(let y = 0; y < h; y++){
    const s = (y0 + y) * S.W + x0;
    a.set(snapBuf.subarray(s, s + w), y * w);
    bb.set(buf.subarray(s, s + w), y * w);
  }
  for(let i = 0; i < a.length; i++) if(a[i] !== bb[i]){ diff = true; break; }
  if(!diff) return false;
  histPush({ t: 'px', id, x: x0, y: y0, w, h, a, b: bb, label, n: a.length * 2 });
  dirtyPix(id);
  return true;
}
function pxAbort(){
  if(!snapId) return;
  const buf = pix.get(snapId);
  if(buf) buf.set(snapBuf);
  snapId = null; PX.bb = null;
}
function tlSnap(){ return { frames: S.frames.map(f => ({ id: f.id, kind: f.kind, dur: f.dur })), cur: S.cur }; }
function tlPush(before, label){ histPush({ t: 'tl', a: before, b: tlSnap(), label, n: 64 }); dirtyMeta(); }
function histPush(e){
  HIST.undo.push(e); HIST.bytes += e.n;
  HIST.redo.length = 0;
  while(HIST.undo.length > HIST_MAX || HIST.bytes > HIST_BYTES){ const o = HIST.undo.shift(); HIST.bytes -= o.n; }
  updUndoUI();
}
function updUndoUI(){ $('#b-undo').classList.toggle('off', !HIST.undo.length); $('#b-redo').classList.toggle('off', !HIST.redo.length); }
function applyHist(e, side){
  if(e.t === 'px'){
    const buf = pix.get(e.id);
    const fi = S.frames.findIndex(f => f.id === e.id);
    if(!buf || fi < 0) return false;
    if(fi !== S.cur) gotoFrame(fi, true);
    const src = e[side];
    for(let y = 0; y < e.h; y++) buf.set(src.subarray(y * e.w, (y + 1) * e.w), (e.y + y) * S.W + e.x);
    markDirty(e.x, e.y, e.x + e.w, e.y + e.h);
    thumbLater(S.frames[fi]);
    dirtyPix(e.id);
    return true;
  }
  const s = e[side];
  S.frames = s.frames.map(f => ({ id: f.id, kind: f.kind, dur: f.dur }));
  S.frames.forEach(f => { if(f.kind === 'draw' && !pix.has(f.id)) pix.set(f.id, newBuf()); });
  S.cur = clamp(s.cur, 0, S.frames.length - 1);
  S.tick = frameStart(S.cur);
  dirtyMeta();   // 画素は変わらない（保存側が「DB に無い id」を拾って書く）
  showFrame(); buildTimeline();
  return true;
}
function undo(){
  if(selActive()){ selCancel(); return; }
  if(stroke) return;
  if(lasso){ lassoCancel(); return; }
  const e = HIST.undo.pop();
  if(!e){ toast('これ以上戻せません'); return; }
  HIST.bytes -= e.n;
  applyHist(e, 'a');
  HIST.redo.push(e);
  updUndoUI(); renderOnionQ();
  toast('↶ ' + (e.label || '戻す'), 1200);
}
function redo(){
  if(selActive() || stroke) return;
  const e = HIST.redo.pop();
  if(!e){ toast('やり直せる操作がありません'); return; }
  applyHist(e, 'b');
  HIST.undo.push(e); HIST.bytes += e.n;
  updUndoUI(); renderOnionQ();
  toast('↷ ' + (e.label || 'やり直す'), 1200);
}
function histClear(){ HIST.undo.length = 0; HIST.redo.length = 0; HIST.bytes = 0; updUndoUI(); }
/* 並びから外れたコマの画素を捨てる（Undo が指していない id だけ） */
function sweepPix(){
  const keep = new Set(S.frames.map(f => f.id));
  for(const e of HIST.undo.concat(HIST.redo)){
    if(e.t === 'px') keep.add(e.id);
    else { e.a.frames.forEach(f => keep.add(f.id)); e.b.frames.forEach(f => keep.add(f.id)); }
  }
  for(const id of Array.from(pix.keys())) if(!keep.has(id)){ pix.delete(id); thumbs.delete(id); }
}

/* ============================================================ §10 PEN・ERASE・FILL・EYE
   筆圧の式・均し・入りのテーパー・STAB・Shift の連結は animator のまま（pressureRadius / smoothPressure / smoothPoint / pendingLine） */
const TOOLS = ['pen', 'erase', 'fill', 'sel'];
const P_EMA_A = 0.25, TAPER_PX = 12, SHIFT_DRAG_PX = 4;
let stroke = null, lasso = null, strokeAnchor = null;
function toolKey(){ return P.tool === 'erase' ? 'erase' : 'pen'; }
function curSize(k){ const s = P.sz[k || toolKey()]; return s.sel === 'big' ? s.big : s.sel; }
function pressOn(e){ if(e && e.pointerType === 'mouse') return false; return P.tool === 'erase' ? P.pressErase : P.pressPen; }
function pCurve(p){ return P.curve === 'soft' ? Math.pow(p, 1.8) : P.curve === 'hard' ? Math.pow(p, 0.55) : p; }
function smoothPressure(st, p){
  if(p == null) return p;
  const raw = clamp(p, 0, 1);
  if(P.psm === 'raw' || st.pSm == null){ st.pSm = raw; return raw; }
  st.pSm += (raw - st.pSm) * P_EMA_A;
  return st.pSm;
}
function pressureRadius(st, p){
  const sz = curSize();
  // 1px/2px は最大半径 3/6、3px 以上は 2px の続きから（animator 2026-10-11 の単調化と同じ）
  const maxR = sz === 1 ? 3 : sz === 2 ? 6 : 6 + (sz - 2) * 0.8;
  const plus = P.psm === 'ema+';
  // ★ 筆圧ちょうど 0 を 0.5 に化かさない（SPEC_18 §2-4）
  const src = P.psm === 'raw' ? (p || 0.5) : (p == null ? 0.5 : p);
  const q = Math.max(plus ? 0.02 : 0.08, Math.min(1, src));
  const floor = plus ? 0.35 : 0.7;
  const taper = plus ? Math.min(1, st.arc / TAPER_PX) : 1;
  return Math.max(floor, maxR * pCurve(q) * taper);
}
function stabPoint(st, x, y){
  const s = P.stab;
  if(s.mode === 'pull'){
    const R = 2 + s.pull * 140, dx = x - st.smX, dy = y - st.smY, d = Math.hypot(dx, dy);
    if(d > R){ const t = (d - R) / d; st.smX += dx * t; st.smY += dy * t; }
    return { x: Math.round(st.smX), y: Math.round(st.smY) };
  }
  if(s.mode === 'avg'){
    const k = 1 - Math.min(0.92, s.avg * 0.92);
    st.smX += (x - st.smX) * k; st.smY += (y - st.smY) * k;
    return { x: Math.round(st.smX), y: Math.round(st.smY) };
  }
  st.smX = x; st.smY = y;
  return { x: Math.round(x), y: Math.round(y) };
}
/* 空コマに描こうとしたら絵のコマに昇格（animator promoteEmptyToFrame と同じ・尺はそのまま） */
function ensureDrawFrame(){
  const f = curFrame();
  if(!f) return null;
  if(f.kind === 'draw') return f;
  const before = tlSnap();
  makeDraw(f);
  tlPush(before, '空コマ → 絵のコマ');
  buildTimeline(); updateStageTag();
  return f;
}
function strokeBegin(e, p, sp){
  if(P.tool === 'erase' && curFrame() && curFrame().kind === 'empty'){ toast('空コマです（消すものがありません）'); return null; }
  const f = ensureDrawFrame(); if(!f) return null;
  const buf = pix.get(f.id);
  const erase = P.tool === 'erase';
  if(!erase) warnHidden();
  pxBegin(f); pxTarget(buf, erase ? 0 : P.color);
  const x = Math.round(p.x), y = Math.round(p.y);
  const st = { kind: 'stroke', id: f.id, erase, x, y, r: 1, pSm: null, arc: 0, smX: x, smY: y, sx: sp.x, sy: sp.y, shift: false, pend: false, moved: false };
  if(e.shiftKey && strokeAnchor && strokeAnchor.id === f.id){ st.shift = true; st.pend = true; st.ox = x; st.oy = y; }
  const usePr = pressOn(e);
  if(usePr){ st.r = pressureRadius(st, smoothPressure(st, e.pressure)); dotR(x, y, st.r); }
  else dotS(x, y, curSize());
  st.usePr = usePr;
  stroke = st;
  return st;
}
function strokeMove(e){
  const st = stroke; if(!st) return;
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  const list = evs.length ? evs : [e];
  for(const ev of list){
    const sp = evStage(ev);
    if(!st.moved && Math.hypot(sp.x - st.sx, sp.y - st.sy) > SHIFT_DRAG_PX) st.moved = true;
    const raw = toCanvas(sp.x, sp.y);
    const sm0 = stabPoint(st, raw.x, raw.y);   // 補正は常に進める（拘束を解いた瞬間に飛ばない）
    let q = sm0;
    if(st.shift){
      if(!st.moved) continue;
      st.pend = false;   // 動かした＝連結はしない（PSD と違う。animator と同じ）
      const dx = Math.abs(raw.x - st.ox), dy = Math.abs(raw.y - st.oy);
      q = dx >= dy ? { x: Math.round(raw.x), y: st.oy } : { x: st.ox, y: Math.round(raw.y) };
    }
    if(q.x === st.x && q.y === st.y) continue;
    st.arc += Math.hypot(q.x - st.x, q.y - st.y);
    if(st.usePr){ const r = pressureRadius(st, smoothPressure(st, ev.pressure)); lineR(st.x, st.y, q.x, q.y, st.r, r); st.r = r; }
    else lineS(st.x, st.y, q.x, q.y, curSize());
    st.x = q.x; st.y = q.y;
  }
  drawOv();
}
function strokeEnd(){
  const st = stroke; if(!st) return;
  stroke = null;
  if(st.pend && strokeAnchor){   // 動かさずに離した Shift+クリック＝前の終点から直線
    lineS(strokeAnchor.x, strokeAnchor.y, st.x, st.y, curSize());
  }
  strokeAnchor = { id: st.id, x: st.x, y: st.y };
  if(pxEnd(st.erase ? '消しゴム' : 'ペン')) thumbLater(curFrame());
}
/* 隠している色（👁）で描くと見えない＝一言だけ知らせる */
let _hidWarnT = 0;
function warnHidden(){
  const hid = (P.color === IDX_ROUGH && P.hideRough) || (P.color === IDX_NOTE && P.hideNote);
  if(!hid || performance.now() - _hidWarnT < 4000) return;
  _hidWarnT = performance.now();
  toast(colName(P.color) + 'の色は隠して表示中です（COLOR の 👁 で戻す）。描いた線は入っています');
}
/* FILL：バケツ（同じ番号のつながり）／投げ縄（なぞる・クリックで多角形） */
function fillDown(e, p, sp){
  if(!P.fillErase) warnHidden();
  if(P.fillMode === 'lasso' || P.fillErase){
    if(lasso && lasso.poly){ polyClick(sp, p); return; }
    lasso = { pts: [p], scr: [sp], moved: false, poly: false, hover: null, erase: P.fillErase, kind: 'fill' };
    drawOv();
    return 'lasso';
  }
  const f = ensureDrawFrame(); if(!f) return;
  const buf = pix.get(f.id);
  pxBegin(f);
  const r = floodFill(buf, p.x, p.y, P.color);
  if(!r){ pxAbort(); toast('ここは塗れません（もう同じ色・紙の外）'); return; }
  PX.bb = r;
  markDirty(r.x0, r.y0, r.x1, r.y1);
  if(pxEnd('塗り')) thumbLater(f);
}
function lassoMove(sp, p){
  if(!lasso) return;
  if(!lasso.moved && Math.hypot(sp.x - lasso.scr[0].x, sp.y - lasso.scr[0].y) > 6) lasso.moved = true;
  const q = lasso.pts[lasso.pts.length - 1];
  if(Math.hypot(p.x - q.x, p.y - q.y) > 2.5 / S.view.z){ lasso.pts.push(p); lasso.scr.push(sp); }
  drawOv();
}
function lassoUp(){
  if(!lasso) return;
  if(!lasso.moved && !lasso.poly){ lasso.poly = true; toast('多角形の投げ縄：クリックで頂点／始点・Enter・Wクリックで閉じる／Esc で取消'); drawOv(); return; }
  if(!lasso.poly) lassoFinish();
}
function polyClick(sp, p){
  const f0 = lasso.scr[0];
  if(lasso.pts.length >= 3 && Math.hypot(sp.x - f0.x, sp.y - f0.y) < 14){ lassoFinish(); return; }
  lasso.pts.push(p); lasso.scr.push(sp); drawOv();
}
function lassoCancel(){ if(!lasso) return false; lasso = null; drawOv(); toast('投げ縄 取消'); return true; }
function lassoFinish(){
  const L = lasso; lasso = null; drawOv();
  if(!L || L.pts.length < 3){ toast('囲いが小さすぎます'); return; }
  if(L.kind === 'sel'){ selLift(L.pts, L.copy); return; }
  const f = ensureDrawFrame(); if(!f) return;
  const buf = pix.get(f.id);
  pxBegin(f);
  const r = lassoFill(buf, L.pts, L.erase ? 0 : P.color);
  if(!r){ pxAbort(); return; }
  PX.bb = r; markDirty(r.x0, r.y0, r.x1, r.y1);
  if(pxEnd(L.erase ? '投げ縄消し' : '投げ縄塗り')) thumbLater(f);
}
/* スポイト：いまのコマの色 → 無ければ下絵画像の色をいちばん近い番号に */
function eyedrop(p){
  const x = Math.floor(p.x), y = Math.floor(p.y);
  if(x < 0 || y < 0 || x >= S.W || y >= S.H) return false;
  const buf = curBuf();
  let v = buf ? buf[y * S.W + x] : 0;
  if(!v && P.refShow && S.refs.some(r => r.vis)){
    const d = cxRef.getImageData(x, y, 1, 1).data;
    if(d[3] > 20){
      let r = d[0], g = d[1], b = d[2];
      if(P.refMono){ const l = Math.round(r * 0.299 + g * 0.587 + b * 0.114); r = g = b = l; }
      const L = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
      v = clamp(Math.round(L * 10), 0, 10) + 1;   // 写真から拾うときは明度だけ（13色の中で一番近い灰色）
    }
  }
  if(!v){ toast('透明です（色がありません）'); return false; }
  setColor(v, true);
  toast('スポイト：' + colName(v));
  return true;
}
function clearFrame(){
  const f = curFrame();
  if(!f || f.kind !== 'draw'){ toast('空コマです'); return; }
  pxBegin(f);
  pix.get(f.id).fill(0);
  PX.bb = { x0: 0, y0: 0, x1: S.W, y1: S.H };
  renderWork();
  if(pxEnd('このコマを全消去')){ thumbLater(f); toast('このコマを全消去（Ctrl+Z で戻せます）'); }
}
function clearColor(idx){
  const f = curFrame();
  if(!f || f.kind !== 'draw'){ toast('空コマです'); return; }
  const buf = pix.get(f.id), W = S.W;
  pxBegin(f);
  let x0 = W, y0 = S.H, x1 = -1, y1 = -1;
  for(let i = 0; i < buf.length; i++) if(buf[i] === idx){
    buf[i] = 0; const x = i % W, y = (i / W) | 0;
    if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y;
  }
  if(x1 < 0){ pxAbort(); toast('このコマに' + colName(idx) + 'の色はありません'); return; }
  PX.bb = { x0, y0, x1: x1 + 1, y1: y1 + 1 };
  markDirty(x0, y0, x1 + 1, y1 + 1);
  if(pxEnd(colName(idx) + 'を消す')){ thumbLater(f); toast('このコマの' + colName(idx) + 'を消しました（Ctrl+Z で戻せます）'); }
}

/* 道具の切替（ボタンとキーは同じ関数を呼ぶ） */
function setTool(t, quiet){
  if(TOOLS.indexOf(t) < 0) return;
  if(t !== 'sel') selSettle();
  else if(lasso && lasso.kind !== 'sel') lasso = null;
  if(lasso && lasso.kind === 'sel' && t !== 'sel') lasso = null;
  if(t !== 'fill' && lasso && lasso.kind === 'fill') lasso = null;
  P.tool = t;
  savePrefs(); updateToolUI(); drawOv();
  if(!quiet && t === 'sel') toast('SEL：なぞって囲む（Shift＝四角・Alt＝コピー）→ 動かす → ▶ で次のコマへ');
}
function toggleMode(t){
  if(t === 'pen'){ P.pressPen = !P.pressPen; setTool('pen', true); toast('ペンの筆圧 ' + (P.pressPen ? 'ON' : 'OFF')); }
  else if(t === 'erase'){ P.pressErase = !P.pressErase; setTool('erase', true); toast('消しゴムの筆圧 ' + (P.pressErase ? 'ON' : 'OFF')); }
  else if(t === 'fill'){ P.fillMode = P.fillMode === 'lasso' ? 'bucket' : 'lasso'; P.fillErase = false; setTool('fill', true); toast('FILL：' + (P.fillMode === 'lasso' ? '投げ縄で塗る（囲った中）' : 'バケツ（同じ色のつながり）')); }
  else if(t === 'sel'){ setTool('sel', true); selToggleWarp(); }
  savePrefs(); updateToolUI(); renderBrush();
}
function holdAction(t){
  if(t === 'erase'){ setTool('erase', true); clearFrame(); }
  else if(t === 'fill'){ P.fillMode = 'lasso'; P.fillErase = !P.fillErase; setTool('fill', true); toast(P.fillErase ? 'FILL：投げ縄で透明に消す' : 'FILL：投げ縄で塗る'); }
  savePrefs(); updateToolUI(); renderBrush();
}
function setColor(idx, keepTool){
  if(!(idx >= 1 && idx < NCOL)) return;
  P.color = idx;
  if(!keepTool && P.tool === 'erase') setTool('pen', true);
  savePrefs(); updateColorUI(); updateStageTag();
}
function setSizeSlot(k){
  const key = toolKey();
  P.sz[key].sel = k === 'big' ? 'big' : (k | 0);
  if(P.tool !== 'pen' && P.tool !== 'erase') setTool('pen', true);
  savePrefs(); updateToolUI(); renderBrush(); drawOv();
}
function setBigSize(v){
  const key = toolKey();
  let n = clamp(Math.round(v), 3, 60);
  if(Math.abs(n - 20) <= 2) n = 20;   // 20 付近は吸い付く（animator と同じ）
  P.sz[key].big = n; P.sz[key].sel = 'big';
  savePrefs(); updateToolUI(); drawOv();
}

/* ============================================================ §11 SEL（切り貼り）
   正準：live-plate draw-sel.js（＝animator gFloat ＝ econte の 箱+rot+warp）を番号の配列に載せ替えたもの。
   ★ 持ち上げ〜確定で Undo 1手（持ち上げる前を pxBegin で控える）。取消は pxAbort（積まない）。
   ★ 確定は flBakeNearest＝1px ずつ逆写像して元の番号を拾う（半透明を作らない＝あとでバケツが途切れない）。
   ★ 「次のコマへ ▶」＝今のコマは持ち上げる前に戻し、形（変形込み）を次のコマに浮かせて貼る。

function selFlip(){
  const g = gFloat; if(!g) return;

  const fl = a => { const o = new Uint8Array(a.length); for(let y = 0; y < h; y++) for(let x = 0; x < w; x++) o[y * w + x] = a[y * w + (w - 1 - x)]; return o; };

}
function selToggleWarp(){

  renderFloat(); updateSelHud();

function selToggleCorner(){

function selHitTest(p){
  const g = gFloat; if(!g) return null;
  const k = S.view.z, hp = (HANDLE_PX * 0.8 + 4) / k;

    const n = g.wn;
    for(let i = 0; i < n * n; i++){
      const r = (i / n) | 0, c = i % n;
      if((r === 0 || r === n - 1) && (c === 0 || c === n - 1)) continue;

    }
  }
  for(let i = 0; i < FL_HANDLES.length; i++){

}
function selDragStart(hit, p, e){
  const g = gFloat;

    const qa = flLocalWarp(g, 1 - hx, 1 - hy), qh = flLocalWarp(g, hx, hy);
    g.drag = { type: 'scale', qa, A: flBox(g, qa.u, qa.v), du: qh.u - qa.u, dv: qh.v - qa.v, w: g.w, h: g.h };
    return;

}
function selDragMove(p, shift){
  const g = gFloat; if(!g || !g.drag) return;
  const d = g.drag;
  if(d.type === 'move'){ g.x = d.x + (p.x - d.sx); g.y = d.y + (p.y - d.sy); }
  else if(d.type === 'warp'){ const l = flToLocal(g, p); g.warp[d.i] = { u: l.u, v: l.v }; g._h = null; }
  else if(d.type === 'rotate'){
    const c = flCenter(g);
    let a = Math.atan2(p.y - c.y, p.x - c.x) - d.a0 + d.rot0;
    if(shift) a = Math.round(a / (Math.PI / 12)) * (Math.PI / 12);
    g.rot = a;
  }else{
    const ax = flAxes(g), dx = p.x - d.A.x, dy = p.y - d.A.y;
    const pu = dx * ax.ex.x + dy * ax.ex.y, pv = dx * ax.ey.x + dy * ax.ey.y;
    let w = d.w, h = d.h;
    if(Math.abs(d.du) > 1e-6) w = Math.max(4, Math.abs(pu / d.du));
    if(Math.abs(d.dv) > 1e-6) h = Math.max(4, Math.abs(pv / d.dv));
    if(shift && Math.abs(d.du) > 1e-6 && Math.abs(d.dv) > 1e-6){
      const kx = w / d.w, ky = h / d.h, s = Math.max(0.02, Math.abs(kx - 1) > Math.abs(ky - 1) ? kx : ky);

    }
    const cx = d.A.x - ax.ex.x * ((d.qa.u - 0.5) * w) - ax.ey.x * ((d.qa.v - 0.5) * h);
    const cy = d.A.y - ax.ex.y * ((d.qa.u - 0.5) * w) - ax.ey.y * ((d.qa.v - 0.5) * h);
    g.w = w; g.h = h; g.x = cx - w / 2; g.y = cy - h / 2;

}
function selDown(e, p, sp){

function selCursor(p){

/* ============================================================ §12 REF（下絵画像のコラージュ）
   数枚の写真・資料を紙の上に並べて下敷きにする（全コマ共通・描いた絵には混ざらない）。
   MOVE を押している間だけ、ペン／マウスで掴む（中＝移動・隅＝拡縮・隅の外＝回転）。指1本＝移動・2本＝拡縮と回転。
   画像は IndexedDB に Blob のまま（rough_db_v1 / ref）。書き出しに入れるかは OUT の「REF」。 */
let refDrag = null, rqRef = 0;
function refById(id){ return S.refs.find(r => r.id === id) || null; }
function refSelObj(){ return refById(S.refSel); }
function loadImg(blob){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => res(im);
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('画像を読めません')); };
    im.src = u;
  });
}
async function addRefBlob(blob, name){
  const im = await loadImg(blob);
  const r = { id: uid('ref'), name: (name || 'IMG').replace(/\.[^.]+$/, '').slice(0, 40), blob, img: im, iw: im.naturalWidth, ih: im.naturalHeight,
    x: S.W / 2, y: S.H / 2, s: 1, rot: 0, op: 100, vis: true, lock: false, flip: false };
  const fit = Math.min(1, (S.W * 0.9) / r.iw, (S.H * 0.9) / r.ih);
  r.s = fit;
  const n = S.refs.length;
  r.x += (n % 5) * 40; r.y += (n % 5) * 30;   // 重ねて置いたとき見分けがつくように少しずらす
  S.refs.push(r);
  S.refSel = r.id;
  dirtyRef(r.id); dirtyMeta();
  return r;
}
async function addRefFiles(files){
  const imgs = Array.from(files || []).filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|webp|gif|bmp|heic)$/i.test(f.name));
  if(!imgs.length){ toast('画像ファイルがありません'); return; }
  let ok = 0;
  for(const f of imgs){ try{ await addRefBlob(f, f.name); ok++; }catch(e){ toast(f.name + '：読めませんでした'); } }
  if(!ok) return;
  if(!P.refShow){ P.refShow = true; savePrefs(); }
  renderRef(); renderRefPanel();
  toast('下絵画像を ' + ok + ' 枚置きました（REF の MOVE で動かす）');
}
function renderRefQ(){ if(!rqRef) rqRef = requestAnimationFrame(() => { rqRef = 0; renderRef(); }); }
function renderRef(){
  cvRef.style.display = P.refShow ? '' : 'none';
  cvRef.style.opacity = P.refOp / 100;
  cvRef.classList.toggle('mono', !!P.refMono);
  cxRef.setTransform(1, 0, 0, 1, 0, 0);
  cxRef.clearRect(0, 0, S.W, S.H);
  drawRefs(cxRef, 1);
  drawOv();
}
function drawRefs(ctx, opMul){
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  for(const r of S.refs){
    if(!r.vis || !r.img) continue;
    ctx.save();
    ctx.globalAlpha = (r.op / 100) * (opMul == null ? 1 : opMul);
    ctx.translate(r.x, r.y); ctx.rotate(r.rot); ctx.scale(r.s * (r.flip ? -1 : 1), r.s);
    ctx.drawImage(r.img, -r.iw / 2, -r.ih / 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function refLocal(r, p){   // 紙の座標 → 画像の中心基準・原寸の座標
  const c = Math.cos(-r.rot), s = Math.sin(-r.rot), dx = p.x - r.x, dy = p.y - r.y;
  return { x: (dx * c - dy * s) / (r.s * (r.flip ? -1 : 1)), y: (dx * s + dy * c) / r.s };
}
function refCorner(r, sx, sy){
  const c = Math.cos(r.rot), s = Math.sin(r.rot), lx = sx * r.iw / 2 * r.s, ly = sy * r.ih / 2 * r.s;
  return { x: r.x + lx * c - ly * s, y: r.y + lx * s + ly * c };
}
function refHit(p){
  for(let i = S.refs.length - 1; i >= 0; i--){
    const r = S.refs[i];
    if(!r.vis || r.lock) continue;
    const l = refLocal(r, p);
    if(Math.abs(l.x) <= r.iw / 2 && Math.abs(l.y) <= r.ih / 2) return r;
  }
  return null;
}
function refDown(e, p){
  let r = refSelObj();
  if(r && !r.lock && r.vis){
    const hp = 14 / S.view.z;
    for(const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]){
      const q = refCorner(r, sx, sy), d = Math.hypot(p.x - q.x, p.y - q.y);
      if(d <= hp){ refDrag = { type: 'scale', r, d0: Math.hypot(p.x - r.x, p.y - r.y), s0: r.s }; return true; }
      if(d <= 46 / S.view.z){ refDrag = { type: 'rot', r, a0: Math.atan2(p.y - r.y, p.x - r.x), rot0: r.rot }; return true; }
    }
    const l = refLocal(r, p);
    if(Math.abs(l.x) <= r.iw / 2 && Math.abs(l.y) <= r.ih / 2){ refDrag = { type: 'move', r, sx: p.x, sy: p.y, x0: r.x, y0: r.y }; return true; }
  }
  r = refHit(p);
  if(!r){ if(S.refSel){ S.refSel = null; renderRefPanel(); drawOv(); } return false; }
  S.refSel = r.id;
  refDrag = { type: 'move', r, sx: p.x, sy: p.y, x0: r.x, y0: r.y };
  renderRefPanel(); drawOv();
  return true;
}
function refMove(p, shift){
  const d = refDrag; if(!d) return;
  const r = d.r;
  if(d.type === 'move'){ r.x = d.x0 + p.x - d.sx; r.y = d.y0 + p.y - d.sy; }
  else if(d.type === 'scale'){ r.s = clamp(d.s0 * Math.hypot(p.x - r.x, p.y - r.y) / Math.max(1, d.d0), 0.02, 40); }
  else { let a = d.rot0 + Math.atan2(p.y - r.y, p.x - r.x) - d.a0; if(shift) a = Math.round(a / (Math.PI / 12)) * (Math.PI / 12); r.rot = a; }
  renderRefQ();
}
function refUp(){ if(refDrag){ refDrag = null; dirtyMeta(); } }
let refPinch = null;
function refPinchBegin(c, d, ang){
  const r = refSelObj();
  if(!r || r.lock || !r.vis) return false;
  const p = toCanvas(c.x, c.y);
  refPinch = { r, d0: d, a0: ang, s0: r.s, rot0: r.rot, px: p.x, py: p.y, x0: r.x, y0: r.y };
  return true;
}
function refPinchMove(c, d, ang){
  const k = refPinch; if(!k) return;
  const r = k.r, p = toCanvas(c.x, c.y);
  r.s = clamp(k.s0 * d / Math.max(1, k.d0), 0.02, 40);
  r.rot = k.rot0 + (ang - k.a0) * Math.PI / 180 * (S.view.flip ? -1 : 1);
  r.x = k.x0 + (p.x - k.px); r.y = k.y0 + (p.y - k.py);
  renderRefQ();
}
function refPinchEnd(){ if(refPinch){ refPinch = null; dirtyMeta(); } }
function setRefMove(on){
  S.refMove = on == null ? !S.refMove : !!on;
  if(S.refMove){ selSettle(); if(!P.refShow){ P.refShow = true; savePrefs(); renderRef(); } if(!S.refSel && S.refs.length) S.refSel = S.refs[S.refs.length - 1].id; }
  stageEl.classList.toggle('pan', false);
  renderRefPanel(); drawOv(); updateStageTag();
  toast(S.refMove ? 'REF MOVE：画像を掴んで動かす（中＝移動・隅＝拡縮・隅の外＝回転・指2本＝拡縮と回転）' : 'REF MOVE OFF（描くに戻る）');
}
function refAct(act, id){
  const r = refById(id);
  if(act === 'sel'){ S.refSel = id; renderRefPanel(); drawOv(); return; }
  if(!r) return;
  if(act === 'vis') r.vis = !r.vis;
  else if(act === 'lock'){ r.lock = !r.lock; toast(r.name + (r.lock ? ' をロック（掴めません）' : ' のロック解除')); }
  else if(act === 'flip') r.flip = !r.flip;
  else if(act === 'up' || act === 'down'){
    const i = S.refs.indexOf(r), j = act === 'up' ? i + 1 : i - 1;
    if(j < 0 || j >= S.refs.length) return;
    S.refs[i] = S.refs[j]; S.refs[j] = r;
  }else if(act === 'del'){
    S.refs = S.refs.filter(x => x !== r);
    if(S.refSel === id) S.refSel = null;
    removedRefs.add(id);
    toast(r.name + ' を外しました');
  }
  dirtyMeta(); renderRef(); renderRefPanel();
}
function refFit(mode){
  const r = refSelObj();
  if(!r){ toast('画像を選んでください（一覧か、MOVE 中にタップ）'); return; }
  if(r.lock){ toast('🔒 ロック中です'); return; }
  r.x = S.W / 2; r.y = S.H / 2; r.rot = 0;
  r.s = mode === 'fit' ? Math.min(S.W / r.iw, S.H / r.ih) : mode === 'cover' ? Math.max(S.W / r.iw, S.H / r.ih) : 1;
  dirtyMeta(); renderRef(); renderRefPanel();
}
async function pasteImageButton(){
  if(!navigator.clipboard || !navigator.clipboard.read){ toast('この環境ではボタンから貼れません（Ctrl+V／⌘V か + 画像）'); return; }
  try{
    const items = await navigator.clipboard.read();
    for(const it of items){
      const t = it.types.find(x => /^image\//.test(x));
      if(t){ const b = await it.getType(t); await addRefBlob(b, 'PASTE ' + (S.refs.length + 1)); renderRef(); renderRefPanel(); toast('貼り付けた画像を下絵に置きました'); return; }
    }

  }catch(e){ toast('貼り付けできませんでした（許可が要ります）'); }

/* ============================================================ §13 タイムライン（コマの並びと尺）
   animator と同じ手つき：コマ＝絵のコマ／空コマ。**末尾の空き（+ TAP）を押すとその時刻に新しいコマ**（直前のコマが伸びる）・
   空コマを押すと絵のコマになる・右端のつまみで尺・×n を押すと 1→2→3・ペン／マウスで横にドラッグ＝並べ替え。
   指は横スクロール（タップは効く）。 */
const TAIL_TICKS = 48;
function gotoFrame(i, keepSel){
  if(!keepSel) selSettle();
  if(lasso && lasso.kind === 'fill' && !keepSel) lasso = null;
  S.cur = clamp(i, 0, S.frames.length - 1);
  S.tick = frameStart(S.cur);
  strokeAnchor = null;
  showFrame();
}
function seekTick(t){
  selSettle();
  const tot = totalTicks();
  S.tick = clamp(t | 0, 0, Math.max(0, tot - 1));
  const i = frameAt(S.tick);
  if(i !== S.cur){ S.cur = i; strokeAnchor = null; renderWork(); renderOnion(); }
  updatePlayhead(); updateInfo(); updateStageTag(); markCurCell();
}
function showFrame(){
  renderWork(); renderOnion();
  updateInfo(); updateStageTag(); updatePlayhead(); markCurCell();
}
function stepFrame(d){
  if(S.playing) stopPlay();
  const n = S.frames.length;
  if(!n) return;
  let i = S.cur + d;
  if(i < 0 || i >= n){ if(!P.loop) return; i = (i + n) % n; }
  gotoFrame(i);
  scrollCurIntoView();
}
function frameNew(){
  selSettle();
  const before = tlSnap(), cur = curFrame();
  const f = blankFrame(cur ? cur.dur : 2);
  S.frames.splice(S.cur + 1, 0, f);
  tlPush(before, '新しいコマ');
  gotoFrame(S.cur + 1); buildTimeline(); scrollCurIntoView();
  toast('新しいコマ（' + (S.cur + 1) + '）');
}
function frameDup(asRough){
  selSettle();
  const cur = curFrame();
  if(!cur) return;
  const before = tlSnap();
  const f = { id: uid('f'), kind: cur.kind, dur: cur.dur };
  if(cur.kind === 'draw'){ const src = pix.get(cur.id); pix.set(f.id, asRough ? toRough(src) : src.slice()); }
  S.frames.splice(S.cur + 1, 0, f);
  tlPush(before, asRough ? '下絵で次へ' : 'コマを複製');
  gotoFrame(S.cur + 1); buildTimeline(); scrollCurIntoView();
  dirtyPix(f.id); thumbLater(f);
  toast(asRough ? '下書の色にして次のコマへ（' + (S.cur + 1) + '）— 上から描いて、終わったら COLOR の 下書 ✕ で消せます' : 'コマを複製（' + (S.cur + 1) + '）', 3600);
}
function frameDel(){
  selSettle();
  const f = curFrame(); if(!f) return;
  const before = tlSnap();
  if(f.kind === 'draw'){
    f.kind = 'empty';
    tlPush(before, '絵のコマ → 空コマ');
    toast('空コマにしました（尺はそのまま）。もう一度 ✕ で詰めます');
  }else{
    if(S.frames.length <= 1){ toast('最後の1コマは消せません'); return; }
    S.frames.splice(S.cur, 1);
    tlPush(before, '空コマを詰める');
    S.cur = Math.min(S.cur, S.frames.length - 1);
    toast('空コマを詰めました');
  }
  gotoFrame(S.cur); buildTimeline();
}
function frameShift(d){
  selSettle();
  const i = S.cur, j = i + d;
  if(j < 0 || j >= S.frames.length) return;
  const before = tlSnap();
  const t = S.frames[i]; S.frames[i] = S.frames[j]; S.frames[j] = t;
  tlPush(before, 'コマを移す');
  gotoFrame(j); buildTimeline(); scrollCurIntoView();
}
function frameMoveTo(from, to){   // to＝挿入位置（0..n）
  if(to === from || to === from + 1) return;
  const before = tlSnap();
  const f = S.frames.splice(from, 1)[0];
  const k = to > from ? to - 1 : to;
  S.frames.splice(k, 0, f);
  tlPush(before, 'コマの並べ替え');
  gotoFrame(k); buildTimeline();
}
function promote(i){
  const f = S.frames[i];
  if(!f || f.kind !== 'empty') return;
  const before = tlSnap();
  makeDraw(f);
  tlPush(before, '空コマ → 絵のコマ');
  gotoFrame(i); buildTimeline();
  toast('空コマを絵のコマにしました（' + (i + 1) + '）');
}
/* 末尾の空きを押した＝押した時刻に新しいコマ（直前のコマがそこまで伸びる。animator setupEmptyTail と同じ） */
function tailAdd(k){
  selSettle();
  const before = tlSnap(), tot = totalTicks();
  const gap = Math.max(0, k - tot);
  const last = S.frames[S.frames.length - 1];
  if(last && gap) last.dur += gap;
  const f = blankFrame(1);
  S.frames.push(f);
  tlPush(before, '新しいコマ（' + (tot + gap + 1) + 'コマ目から）');
  gotoFrame(S.frames.length - 1); buildTimeline(); scrollCurIntoView();
}
function setDur(i, d, live){
  const f = S.frames[i]; if(!f) return;
  f.dur = clamp(d | 0, 1, 240);
  if(live){ layoutCells(); return; }
  dirtyMeta(); buildTimeline(); updateInfo();
}
function cycleDur(i){
  const f = S.frames[i]; if(!f) return;
  if(f.dur > 3){ toast('長さは右端のつまみで（×' + f.dur + '）'); return; }
  const before = tlSnap();
  f.dur = f.dur >= 3 ? 1 : f.dur + 1;
  tlPush(before, '尺 ×' + f.dur);
  buildTimeline(); updateInfo(); updatePlayhead();
}

/* --- 描画 --- */
function buildTimeline(){
  const cells = $('#tl-cells'), ppt = P.ppt;
  const tot = totalTicks();
  cells.innerHTML = '';
  S.frames.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'cel' + (f.kind === 'empty' ? ' emp' : '');
    el.dataset.i = i;
    if(f.kind === 'draw'){
      const th = thumbOf(f.id);
      if(!th.width) updateThumb(f);
      el.appendChild(th);
    }else{
      const k = document.createElement('div'); k.className = 'ek'; k.textContent = '空'; el.appendChild(k);
    }
    const m = document.createElement('div'); m.className = 'meta';
    m.innerHTML = '<b>' + pad(i + 1) + '</b><span class="du" title="尺（押すと 1→2→3）">×' + f.dur + '</span>';
    el.appendChild(m);
    const rh = document.createElement('div'); rh.className = 'rh'; rh.title = 'ドラッグで尺'; el.appendChild(rh);
    cells.appendChild(el);
  });
  const tail = document.createElement('div');
  tail.className = 'tail'; tail.id = 'tl-tail';
  tail.innerHTML = '<span class="lbl">+ TAP</span><div class="gh"></div>';
  tail.title = '押した時刻に新しいコマ（直前のコマがそこまで伸びる）';
  cells.appendChild(tail);
  layoutCells();
  buildRuler(tot);
  markCurCell(); updatePlayhead();
}
function layoutCells(){
  const ppt = P.ppt, body = $('#tl-body');
  let t = 0;
  const els = $('#tl-cells').children;
  for(let i = 0; i < S.frames.length; i++){
    const el = els[i], f = S.frames[i];
    if(!el) break;
    el.style.left = (t * ppt) + 'px';
    el.style.width = Math.max(4, f.dur * ppt - 1) + 'px';
    el.classList.toggle('narrow', f.dur * ppt < 40);
    const du = el.querySelector('.du'); if(du) du.textContent = '×' + f.dur;
    t += f.dur;
  }
  const tail = $('#tl-tail');
  const tailW = Math.max(TAIL_TICKS * ppt, (body.clientWidth || 800) - t * ppt + ppt * 8);
  if(tail){ tail.style.left = (t * ppt) + 'px'; tail.style.width = tailW + 'px'; tail.style.setProperty('--ppt', ppt + 'px'); }
  $('#tl-inner').style.width = (t * ppt + tailW + 4) + 'px';
}
function buildRuler(tot){
  const ppt = P.ppt, el = $('#tl-ruler');
  const n = tot + Math.ceil((($('#tl-body').clientWidth || 800) / ppt)) + TAIL_TICKS;
  const lab = ppt >= 18 ? 6 : ppt >= 9 ? 12 : 24;
  let h = '';
  for(let t = 0; t <= n; t++){
    const x = t * ppt;
    if(t % lab === 0) h += '<i class="s" style="left:' + x + 'px"></i><u style="left:' + x + 'px">' + (t % P.fps === 0 ? (t / P.fps) + 's' : t + 1) + '</u>';
    else if(ppt >= 6) h += '<i style="left:' + x + 'px"></i>';
  }
  el.innerHTML = h;
}
function markCurCell(){
  $$('#tl-cells .cel').forEach(el => el.classList.toggle('cur', +el.dataset.i === S.cur));
}
function updatePlayhead(){
  const ph = $('#tl-ph'), ppt = P.ppt;
  ph.style.left = (S.tick * ppt + ppt / 2) + 'px';
  const tot = totalTicks();
  $('#tl-time').innerHTML = pad(S.tick + 1, 4) + '<span> / ' + pad(tot, 4) + ' · ' + (S.tick / P.fps).toFixed(2) + 's</span>';
}
function scrollCurIntoView(){
  const body = $('#tl-body'), ppt = P.ppt;
  const x0 = frameStart(S.cur) * ppt, x1 = x0 + (curFrame() ? curFrame().dur * ppt : ppt);
  if(x0 < body.scrollLeft + 20) body.scrollLeft = Math.max(0, x0 - 40);
  else if(x1 > body.scrollLeft + body.clientWidth - 20) body.scrollLeft = x1 - body.clientWidth + 60;
}
function tlZoom(f){
  const body = $('#tl-body'), ppt0 = P.ppt;
  const mid = (body.scrollLeft + body.clientWidth / 2) / ppt0;
  P.ppt = clamp(Math.round(P.ppt * f), 4, 80);
  savePrefs(); buildTimeline();
  body.scrollLeft = mid * P.ppt - body.clientWidth / 2;
}

/* --- 入力（#tl-cells にまとめて） --- */
function setupTimelineInput(){
  const cells = $('#tl-cells'), body = $('#tl-body');
  let d = null;
  cells.addEventListener('pointerdown', e => {
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    const rh = e.target.closest('.rh'), du = e.target.closest('.du'), cel = e.target.closest('.cel'), tail = e.target.closest('.tail');
    const x = e.clientX, y = e.clientY;
    if(rh && cel){
      e.preventDefault();
      const i = +cel.dataset.i;
      d = { kind: 'dur', i, x0: x, d0: S.frames[i].dur, before: tlSnap(), id: e.pointerId };
      rh.classList.add('act');
      try{ cells.setPointerCapture(e.pointerId); }catch(err){}
      return;
    }
    d = { kind: cel ? 'cel' : tail ? 'tail' : 'none', i: cel ? +cel.dataset.i : -1, x0: x, y0: y, du: !!du, touch: e.pointerType === 'touch', moved: false, id: e.pointerId };
    if(d.kind === 'cel' && !d.touch){ try{ cells.setPointerCapture(e.pointerId); }catch(err){} }
  });
  cells.addEventListener('pointermove', e => {
    const tail = $('#tl-tail');
    if(!d && tail && e.pointerType !== 'touch'){   // + TAP のゴースト（押すとここに出来る）
      const r = tail.getBoundingClientRect();
      const gh = tail.querySelector('.gh');
      if(e.clientX >= r.left && e.clientX <= r.right && gh){ gh.style.left = (Math.floor((e.clientX - r.left) / P.ppt) * P.ppt) + 'px'; }
    }
    if(!d || e.pointerId !== d.id) return;
    if(d.kind === 'dur'){
      const nd = Math.max(1, d.d0 + Math.round((e.clientX - d.x0) / P.ppt));
      if(nd !== S.frames[d.i].dur){ setDur(d.i, nd, true); updatePlayhead(); }
      return;
    }
    if(Math.hypot(e.clientX - d.x0, e.clientY - d.y0) > 8) d.moved = true;
    if(d.kind === 'cel' && !d.touch && d.moved){   // ペン／マウスの横ドラッグ＝並べ替え
      d.kind = 'reorder';
      const el = cells.querySelector('.cel[data-i="' + d.i + '"]'); if(el) el.classList.add('lift');
    }
    if(d.kind === 'reorder'){
      const to = dropIndexAt(e.clientX);
      d.to = to;
      const drop = $('#tl-drop');
      drop.style.display = 'block';
      drop.style.left = (frameStart(to) * P.ppt) + 'px';
    }
  });
  const end = e => {
    if(!d || (e && e.pointerId !== d.id)) return;
    const dd = d; d = null;
    $$('#tl-cells .rh.act').forEach(x => x.classList.remove('act'));
    $('#tl-drop').style.display = 'none';
    if(dd.kind === 'dur'){
      const f = S.frames[dd.i];
      if(f && f.dur !== dd.d0){ tlPush(dd.before, '尺 ×' + f.dur); buildTimeline(); updateInfo(); updatePlayhead(); return; }
      if(e.type === 'pointercancel' || Math.abs(e.clientX - dd.x0) > 6){ buildTimeline(); return; }
      // 動かさずに離した＝コマを押したのと同じ（1コマ打ちの細いコマはつまみが大半を占めるため）
      if(S.playing) stopPlay();
      if(f && f.kind === 'empty'){ promote(dd.i); return; }
      gotoFrame(dd.i); markCurCell();
      return;
    }
    if(e.type === 'pointercancel') { buildTimeline(); return; }
    if(dd.kind === 'reorder'){ if(dd.to != null) frameMoveTo(dd.i, dd.to); else buildTimeline(); return; }
    if(dd.moved) return;
    if(dd.kind === 'cel'){
      if(S.playing) stopPlay();
      if(dd.du && S.frames[dd.i] && S.frames[dd.i].kind === 'draw' && dd.i === S.cur){ cycleDur(dd.i); return; }
      if(S.frames[dd.i] && S.frames[dd.i].kind === 'empty'){ promote(dd.i); return; }
      gotoFrame(dd.i);
    }else if(dd.kind === 'tail'){
      if(S.playing) stopPlay();
      const tail = $('#tl-tail'), r = tail.getBoundingClientRect();
      const k = totalTicks() + Math.max(0, Math.floor((e.clientX - r.left) / P.ppt));
      tailAdd(k);
    }
  };
  cells.addEventListener('pointerup', end);
  cells.addEventListener('pointercancel', end);
  function dropIndexAt(cx){
    const r = $('#tl-inner').getBoundingClientRect();
    const t = (cx - r.left) / P.ppt;
    let acc = 0;
    for(let i = 0; i < S.frames.length; i++){ const dur = S.frames[i].dur; if(t < acc + dur / 2) return i; acc += dur; }
    return S.frames.length;
  }
  // ルーラー＝時刻を合わせる（そのコマが出る）
  const ruler = $('#tl-ruler');
  let rs = false;
  const rseek = e => { const r = $('#tl-inner').getBoundingClientRect(); seekTick(Math.floor((e.clientX - r.left) / P.ppt)); };
  ruler.addEventListener('pointerdown', e => { if(S.playing) stopPlay(); rs = true; try{ ruler.setPointerCapture(e.pointerId); }catch(err){} rseek(e); e.preventDefault(); });
  ruler.addEventListener('pointermove', e => { if(rs) rseek(e); });
  ruler.addEventListener('pointerup', () => { rs = false; scrollCurIntoView(); });
  ruler.addEventListener('pointercancel', () => { rs = false; });
  body.addEventListener('wheel', e => {
    if(e.ctrlKey || e.metaKey){ e.preventDefault(); tlZoom(e.deltaY < 0 ? 1.15 : 1 / 1.15); }
    else if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ body.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });
}

/* --- 再生 --- */
let playRAF = 0, playT0 = 0, playK0 = 0;
function togglePlay(){ if(S.playing) stopPlay(); else startPlay(); }
function startPlay(){
  selSettle();
  if(lasso) lasso = null;
  const tot = totalTicks();
  if(tot <= 1){ toast('コマが1つだけです'); return; }
  S.playing = true;
  document.body.classList.add('playing');
  $('#tl-play').textContent = '■'; $('#tl-play').classList.add('on');
  playT0 = performance.now();
  playK0 = S.tick >= tot - 1 ? 0 : S.tick;
  cvOnion.style.display = 'none';
  drawOv();
  const loop = now => {
    if(!S.playing) return;
    const tot2 = totalTicks();
    let k = playK0 + Math.floor((now - playT0) * P.fps / 1000);
    if(k >= tot2){
      if(P.loop){ k = k % tot2; }
      else { S.tick = tot2 - 1; stopPlay(); return; }
    }
    if(k !== S.tick){
      S.tick = k;
      const i = frameAt(k);
      if(i !== S.cur){ S.cur = i; renderWork(); markCurCell(); updateInfo(); updateStageTag(); }
      updatePlayhead();
    }
    playRAF = requestAnimationFrame(loop);
  };
  playRAF = requestAnimationFrame(loop);
}
function stopPlay(){
  if(!S.playing) return;
  S.playing = false;
  cancelAnimationFrame(playRAF);
  document.body.classList.remove('playing');
  $('#tl-play').textContent = '▶'; $('#tl-play').classList.remove('on');
  showFrame();
}
function cycleOnion(side){
  const k = side === 'prev' ? 'prev' : 'next';
  P.onion[k] = (P.onion[k] + 1) % 4;
  if(P.onion[k] && !P.onion.on) P.onion.on = true;
  savePrefs(); renderOnion(); updateOnionUI();
}
function toggleOnion(){ P.onion.on = !P.onion.on; savePrefs(); renderOnion(); updateOnionUI(); toast('オニオン ' + (P.onion.on ? 'ON（前＝赤・後＝青）' : 'OFF')); }
function updateOnionUI(){
  const O = P.onion;
  $('#on-tog').classList.toggle('on', O.on);
  const pv = $('#on-prev'), nx = $('#on-next');
  pv.querySelector('i').style.background = O.cPrev; nx.querySelector('i').style.background = O.cNext;
  pv.querySelector('span').textContent = '前 ' + O.prev; nx.querySelector('span').textContent = '後 ' + O.next;
  pv.classList.toggle('zero', !O.on || !O.prev); nx.classList.toggle('zero', !O.on || !O.next);
  refreshScrubs($('#tl-head'));
}

/* ============================================================ §14 パネル（ドック式。見出しをドラッグ＝浮かせる／ドックの上で離す＝そこに入る。⇱＝浮かせる⇄戻す）
   TOOLS・COLOR は細いレール（広いドックに入ると横に並び直す）。TIMELINE は下のドック専用（浮かせることはできる）。
   並びは localStorage（rough_layout_v1）に覚える＝端末ごとの好み。 */
const PANELS = ['tools', 'color', 'brush', 'ref', 'out', 'timeline'];
// 既定：左＝TOOLS／右＝COLOR・REF・OUT・BRUSH（畳む）。iPad 11" 横（高さ 834）で左に COLOR まで積むと下書・指示が隠れるため、
//   色は ANIMATOR のパレットと同じく右に置く（ドラッグで左へも移せる）。
const LAYOUT_DEF = { tools: { d: 'l', o: 0 }, color: { d: 'r', o: 0 }, ref: { d: 'r', o: 1 }, out: { d: 'r', o: 2 }, brush: { d: 'r', o: 3, min: true }, timeline: { d: 'b', o: 0 } };
let LAYOUT = null;
function loadLayout(){
  LAYOUT = JSON.parse(JSON.stringify(LAYOUT_DEF));
  try{
    const o = JSON.parse(localStorage.getItem(LS_LAYOUT) || 'null');
    if(o) for(const k of PANELS) if(o[k] && /^[lrbf]$/.test(o[k].d)) LAYOUT[k] = Object.assign(LAYOUT[k], o[k]);
  }catch(e){}
  for(const k of PANELS){ const L = LAYOUT[k]; if(!L.last) L.last = L.d === 'f' ? LAYOUT_DEF[k].d : L.d; if(k === 'timeline' && (L.d === 'l' || L.d === 'r')) L.d = 'b'; if(k !== 'timeline' && L.d === 'b') L.d = 'r'; }
}
function saveLayout(){ try{ if(!HARNESS) localStorage.setItem(LS_LAYOUT, JSON.stringify(LAYOUT)); }catch(e){} }
function panelEl(k){ return $('#p-' + k); }
function applyLayout(){
  const docks = { l: $('#dock-l'), r: $('#dock-r'), b: $('#dock-b') };
  for(const d of ['l', 'r', 'b']){
    const ks = PANELS.filter(k => LAYOUT[k].d === d).sort((a, b) => LAYOUT[a].o - LAYOUT[b].o);
    ks.forEach((k, i) => { LAYOUT[k].o = i; const el = panelEl(k); el.classList.remove('float'); el.style.left = el.style.top = ''; docks[d].appendChild(el); });
    docks[d].classList.toggle('empty', !ks.length);
    docks[d].classList.toggle('wide', ks.some(k => panelEl(k).dataset.kind === 'wide'));
  }
  for(const k of PANELS){
    const L = LAYOUT[k], el = panelEl(k);
    el.classList.toggle('mini', !!L.min);
    const mb = el.querySelector('[data-act="min"]'); if(mb) mb.textContent = L.min ? '▸' : '▾';
    const fb = el.querySelector('[data-act="float"]');
    if(fb){ fb.textContent = L.d === 'f' ? '⇲' : '⇱'; fb.title = L.d === 'f' ? 'ドックに戻す' : '浮かせる（見出しをドラッグしても浮く）'; }
    if(L.d !== 'f') continue;
    if(el.parentNode !== document.body) document.body.appendChild(el);
    el.classList.add('float');
    placeFloat(el, L);
  }
  saveLayout();
}
function placeFloat(el, L){
  const w = el.offsetWidth || 260, h = el.offsetHeight || 200;
  L.x = clamp(L.x == null ? 120 : L.x, 0, Math.max(0, innerWidth - Math.min(w, 120)));
  L.y = clamp(L.y == null ? 120 : L.y, 0, Math.max(0, innerHeight - 40));
  el.style.left = L.x + 'px'; el.style.top = L.y + 'px';
  if(h > innerHeight - L.y - 10 && L.y > 60){ L.y = Math.max(50, innerHeight - h - 10); el.style.top = L.y + 'px'; }
}
let zIdx = 60;
function raise(el){ el.style.zIndex = ++zIdx; if(zIdx > 95) { zIdx = 61; $$('.pnl.float').forEach(p => p.style.zIndex = 60); el.style.zIndex = zIdx; } }
function togglePanelFloat(k){
  const L = LAYOUT[k], el = panelEl(k);
  if(L.d === 'f'){ L.d = L.last || LAYOUT_DEF[k].d; L.o = 99; }
  else {
    const r = el.getBoundingClientRect();
    L.last = L.d; L.d = 'f';
    L.x = L.last === 'r' ? r.left - 280 : L.last === 'l' ? r.right + 30 : r.left + 40;
    L.y = L.last === 'b' ? r.top - 200 : r.top + 10;
  }
  applyLayout(); afterLayout();
}
function afterLayout(){ requestAnimationFrame(() => { onStageResize(); layoutCells(); }); }
function swapDocks(){
  for(const k of PANELS){ const L = LAYOUT[k]; if(L.d === 'l') L.d = 'r'; else if(L.d === 'r') L.d = 'l'; if(L.last === 'l') L.last = 'r'; else if(L.last === 'r') L.last = 'l'; }
  applyLayout(); afterLayout();
  toast('パネルの左右を入れ替えました（Tab）');
}
function resetLayout(){ LAYOUT = JSON.parse(JSON.stringify(LAYOUT_DEF)); for(const k of PANELS) LAYOUT[k].last = LAYOUT[k].d; applyLayout(); afterLayout(); toast('パネルの並びを初期に戻しました'); }
function setPanelDock(k, d){
  const L = LAYOUT[k];
  if(k === 'timeline' && (d === 'l' || d === 'r')) return;
  if(k !== 'timeline' && d === 'b') return;
  if(d === 'f'){ if(L.d !== 'f') togglePanelFloat(k); return; }
  L.d = d; L.last = d; L.o = 99;
  applyLayout(); afterLayout();
}
function setupPanels(){
  for(const k of PANELS){
    const el = panelEl(k), head = el.querySelector('.ph');
    el.addEventListener('pointerdown', () => { if(LAYOUT[k].d === 'f') raise(el); }, true);
    head.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if(!b) return;
      e.stopPropagation();
      if(b.dataset.act === 'min'){ LAYOUT[k].min = !LAYOUT[k].min; applyLayout(); afterLayout(); }
      else if(b.dataset.act === 'float') togglePanelFloat(k);
    });
    let d = null;
    head.addEventListener('pointerdown', e => {
      if(e.target.closest('button')) return;
      if(e.button !== 0 && e.pointerType === 'mouse') return;
      const r = el.getBoundingClientRect();
      d = { x0: e.clientX, y0: e.clientY, rx: r.left, ry: r.top, moving: false, zone: null, id: e.pointerId };
      try{ head.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    head.addEventListener('pointermove', e => {
      if(!d || e.pointerId !== d.id) return;
      const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      if(!d.moving){
        if(Math.hypot(dx, dy) < 7) return;
        d.moving = true;
        const L = LAYOUT[k];
        if(L.d !== 'f'){ L.last = L.d; L.d = 'f'; L.x = d.rx; L.y = d.ry; applyLayout(); afterLayout(); }
        raise(el); el.classList.add('lifting');
        document.body.classList.add('docking');
        placeZones(k);
      }
      const L = LAYOUT[k];
      L.x = d.rx + dx; L.y = Math.max(0, d.ry + dy);
      el.style.left = L.x + 'px'; el.style.top = L.y + 'px';
      d.zone = zoneAt(k, e.clientX, e.clientY);

      if(!d || (e && e.pointerId !== d.id)) return;

      $$('.dz').forEach(z => z.classList.remove('hot'));
      if(!dd.moving){
        const now = performance.now();   // 見出しの2回押し＝畳む／開く
        if(now - (head._lt || 0) < 350){ head._lt = 0; LAYOUT[k].min = !LAYOUT[k].min; applyLayout(); afterLayout(); }
        else head._lt = now;
        return;
      }
      if(dd.zone){
        const L = LAYOUT[k];
        L.d = dd.zone; L.last = dd.zone;
        L.o = dockOrderAt(dd.zone, k, e ? e.clientY : 0, e ? e.clientX : 0);
        PANELS.filter(x => x !== k && LAYOUT[x].d === dd.zone && LAYOUT[x].o >= L.o).forEach(x => LAYOUT[x].o += 1);

function placeZones(k){

  const dl = $('#dock-l').getBoundingClientRect(), dr = $('#dock-r').getBoundingClientRect();
  const set = (id, x, y, w, h, show) => { const z = $('#' + id); z.style.left = x + 'px'; z.style.top = y + 'px'; z.style.width = w + 'px'; z.style.height = h + 'px'; z.style.visibility = show ? 'visible' : 'hidden'; };
  const tl = k === 'timeline';
  set('dz-l', Math.min(dl.left, st.left), st.top, Math.max(dl.width, 0) + 70, st.height, !tl);
  set('dz-r', st.right - 70, st.top, 70 + Math.max(dr.width, 0), st.height, !tl);
  set('dz-b', st.left, st.bottom - 64, st.width, 64 + Math.max(0, $('#dock-b').getBoundingClientRect().height), tl);
}
function zoneAt(k, x, y){
  for(const z of (k === 'timeline' ? ['b'] : ['l', 'r'])){
    const r = $('#dz-' + z).getBoundingClientRect();
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return z;

}
function dockOrderAt(d, k, cy, cx){
  const ks = PANELS.filter(x => x !== k && LAYOUT[x].d === d).sort((a, b) => LAYOUT[a].o - LAYOUT[b].o);
  for(let i = 0; i < ks.length; i++){
    const r = panelEl(ks[i]).getBoundingClientRect();
    if(d === 'b' ? cx < r.left + r.width / 2 : cy < r.top + r.height / 2) return LAYOUT[ks[i]].o;
  }
  return ks.length ? LAYOUT[ks[ks.length - 1]].o + 1 : 0;
}

async function onSettings(e){

  if(b.dataset.act === 'finger'){ P.fingerDraw = b.dataset.v === '1'; savePrefs(); buildSettings(); return; }

  const sp = evStage(e), p = toCanvas(sp.x, sp.y);

/* --- 指 --- */
function pairMetrics(){

function touchDown(e){

    if(S.refMove){ const p = toCanvas(sp.x, sp.y); if(refDown(e, p)){ drag = { kind: 'ref', id: e.pointerId }; tSession.used = true; } return; }

      else if(drag.kind === 'lasso' || drag.kind === 'sel') lasso = null;
      drag = null; tFingerDraw = false; drawOv();
    }
    if(drag && drag.kind === 'ref'){ refUp(); drag = null; }
    tPan = null;
    const m = pairMetrics();
    if(S.refMove && refPinchBegin(m.c, m.d, m.a)){ tSession.used = true; tPinchArmed = null; return; }

  if(refPinch && touchPtrs.size >= 2){ const m = pairMetrics(); refPinchMove(m.c, m.d, m.a); return; }

      tPinch = { d0: m.d, a0: m.a, z0: S.view.z, rot0: S.view.rot, anchor: toCanvas(m.c.x, m.c.y) };   // 発動した瞬間を基準に取り直す
    }
    const k = tPinch, v = S.view;

}
function eyeMove(sp){
  if(!tEye) return;

    tEye.last = now;
    const p = toCanvas(sp.x, sp.y), buf = curBuf();
    const v = buf && p.x >= 0 && p.y >= 0 && p.x < S.W && p.y < S.H ? buf[Math.floor(p.y) * S.W + Math.floor(p.x)] : 0;
    if(v && v !== P.color){ setColor(v, true); toast('スポイト：' + colName(v), 900); }
