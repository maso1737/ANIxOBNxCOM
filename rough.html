function eyeClear(){ if(tEye){ clearTimeout(tEye.t); tEye = null; } }

/* --- キー --- */
const keyT = {};
let holdTimer = 0;
function onKeyDown(e){
  if(gModalOpen) return;
  if(captureKey(e)) return;
  const tg = e.target;
  if(tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable)) return;
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key;
  if(mod && (k === ' ' || e.code === 'Space')){ e.preventDefault(); handKey = true; stageEl.style.cursor = 'zoom-in'; return; }   // 再生に渡さない
  if(mod){
    const kk = k.toLowerCase();
    if(kk === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
    if((kk === 'z' && e.shiftKey) || kk === 'y'){ e.preventDefault(); redo(); return; }
    if(kk === 'c' && gFloat){ e.preventDefault(); selCopy(); return; }
    if(kk === 'v' && P.tool === 'sel' && gClip){ e.preventDefault(); selPaste(); return; }
    if(kk === 's'){ e.preventDefault(); saveProject(); return; }
    return;   // Ctrl+V（画像）は paste イベントで受ける
  }
  if(k === 'Escape'){
    if($('#set-ovl').classList.contains('show')){ toggleSettings(false); return; }
    if(selCancel()) return;
    if(lasso){ lassoCancel(); return; }
    if(S.playing){ stopPlay(); return; }
    if(S.refMove){ setRefMove(false); return; }
    if(document.fullscreenElement){ document.exitFullscreen().catch(() => {}); }
    return;
  }
  if($('#set-ovl').classList.contains('show')) return;
  if(k === 'Enter'){
    if(lasso && lasso.poly){ e.preventDefault(); lassoFinish(); return; }
    if(gFloat){ e.preventDefault(); selCommit(); return; }
    return;
  }
  const name = keyName(e);
  if(name === 'Space' && keyOf('play') === 'Space'){
    e.preventDefault();
    if(e.repeat) return;
    spaceDown = true; spacePanned = false;
    stageEl.classList.add('pan');
    return;
  }
  const a = actionForKey(name);
  if(!a) return;
  if(a.prevent) e.preventDefault();
  if(e.repeat){ if((a.id === 'prev' || a.id === 'next') && !gFloat) a.run(e); return; }   // 押しっぱなしで形を運び続けない
  const now = performance.now();
  clearTimeout(holdTimer);
  if(a.dbl && now - (keyT[a.id] || 0) < KEY_DBL_MS){ keyT[a.id] = 0; a.dbl(e); return; }
  keyT[a.id] = now;
  a.run(e);
  if(a.hold) holdTimer = setTimeout(() => { keyT[a.id] = 0; a.hold(e); }, HOLD_MS);
}
function onKeyUp(e){
  clearTimeout(holdTimer);
  if(handKey && (e.key === ' ' || e.code === 'Space' || e.key === 'Control' || e.key === 'Meta')){ handKey = false; spaceDown = false; stageEl.style.cursor = ''; return; }
  if(keyName(e) === 'Space' || e.key === ' '){
    if(spaceDown && !spacePanned) togglePlay();
    spaceDown = false; stageEl.classList.remove('pan');
  }
}
async function onPaste(e){
  const tg = e.target;
  if(tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
  const items = Array.from((e.clipboardData && e.clipboardData.items) || []);
  const it = items.find(x => x.kind === 'file' && /^image\//.test(x.type));
  if(!it) return;
  e.preventDefault();
  const b = it.getAsFile();
  if(b){ await addRefBlob(b, 'PASTE ' + (S.refs.length + 1)); if(!P.refShow){ P.refShow = true; savePrefs(); } renderRef(); renderRefPanel(); toast('貼り付けた画像を下絵（REF）に置きました'); }
}

/* ============================================================ §17 保存（IndexedDB rough_db_v1：meta / pix（RLE）/ ref（Blob））
   差分だけ・debounce 700ms。iPad でアプリを切り替えた瞬間（visibilitychange）にも書く。 */
let db = null, saveT = 0, saving = false, metaDirtyF = false;
const dirtyPixSet = new Set(), dirtyRefSet = new Set(), removedRefs = new Set(), savedPix = new Set();
function dirtyPix(id){ dirtyPixSet.add(id); schedSave(); }
function dirtyMeta(){ metaDirtyF = true; schedSave(); }
function dirtyRef(id){ dirtyRefSet.add(id); schedSave(); }
function schedSave(){ clearTimeout(saveT); saveT = setTimeout(doSave, 700); setSaveSt('busy'); }
function setSaveSt(s){
  const el = $('#save-st');
  el.classList.toggle('busy', s === 'busy'); el.classList.toggle('err', s === 'err');
  el.textContent = s === 'busy' ? '● 保存待ち' : s === 'err' ? '× 保存できません' : s === 'saved' ? '✓ 保存済' : '—';
}
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if(!d.objectStoreNames.contains('pix')) d.createObjectStore('pix', { keyPath: 'id' });
      if(!d.objectStoreNames.contains('ref')) d.createObjectStore('ref', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function metaRecord(){
  return {
    v: 1, pid: S.pid, name: S.name, W: S.W, H: S.H, fps: P.fps, cur: S.cur,
    frames: S.frames.map(f => ({ id: f.id, kind: f.kind, dur: f.dur })),
    refs: S.refs.map(r => ({ id: r.id, name: r.name, iw: r.iw, ih: r.ih, x: r.x, y: r.y, s: r.s, rot: r.rot, op: r.op, vis: r.vis, lock: r.lock, flip: r.flip })),
    refSel: S.refSel, savedAt: Date.now(),
  };
}
async function doSave(){
  saveT = 0;
  if(HARNESS || !db){ setSaveSt(''); return; }
  if(saving){ schedSave(); return; }
  if(stroke){ schedSave(); return; }   // 描いている途中は待つ
  saving = true;
  try{
    const drawIds = new Set(S.frames.filter(f => f.kind === 'draw').map(f => f.id));
    const putPix = [];
    for(const id of drawIds) if(dirtyPixSet.has(id) || !savedPix.has(id)){ const b = pix.get(id); if(b) putPix.push({ id, rle: rleEncode(b) }); }
    const delPix = Array.from(savedPix).filter(id => !drawIds.has(id));
    const putRef = Array.from(dirtyRefSet).map(id => refById(id)).filter(Boolean).map(r => ({ id: r.id, blob: r.blob }));
    const delRef = Array.from(removedRefs);
    dirtyPixSet.clear(); dirtyRefSet.clear(); removedRefs.clear();
    const meta = metaRecord(); metaDirtyF = false;
    await new Promise((res, rej) => {
      const tx = db.transaction(['meta', 'pix', 'ref'], 'readwrite');
      tx.objectStore('meta').put(meta, 'project');
      const ps = tx.objectStore('pix');
      putPix.forEach(r => ps.put({ id: r.id, w: S.W, h: S.H, rle: r.rle }));
      delPix.forEach(id => ps.delete(id));
      const rs = tx.objectStore('ref');
      putRef.forEach(r => rs.put(r));
      delRef.forEach(id => rs.delete(id));
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
    putPix.forEach(r => savedPix.add(r.id));
    delPix.forEach(id => savedPix.delete(id));
    setSaveSt('saved');
  }catch(err){
    console.warn('save failed', err);
    setSaveSt('err');
  }finally{ saving = false; }
}
function flushSave(){ if(saveT){ clearTimeout(saveT); doSave(); } }
function idbAll(store){
  return new Promise((res, rej) => { const r = db.transaction(store, 'readonly').objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
}
function idbGet(store, key){
  return new Promise((res, rej) => { const r = db.transaction(store, 'readonly').objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function loadProject(){
  if(!db) return false;
  const m = await idbGet('meta', 'project');
  if(!m || !Array.isArray(m.frames) || !m.frames.length) return false;
  S.pid = m.pid || S.pid; S.name = m.name || 'ROUGH';
  S.W = m.W | 0 || DEF_W; S.H = m.H | 0 || DEF_H;
  if(m.fps) P.fps = m.fps;
  S.frames = m.frames.map(f => ({ id: f.id, kind: f.kind === 'empty' ? 'empty' : 'draw', dur: Math.max(1, f.dur | 0) }));
  const recs = await idbAll('pix');
  const n = S.W * S.H;
  for(const r of recs){
    if(r.w !== S.W || r.h !== S.H) continue;
    pix.set(r.id, rleDecode(r.rle, n));
    savedPix.add(r.id);
  }
  S.frames.forEach(f => { if(f.kind === 'draw' && !pix.has(f.id)) pix.set(f.id, newBuf()); });
  S.cur = clamp(m.cur | 0, 0, S.frames.length - 1);
  S.tick = frameStart(S.cur);
  const blobs = new Map((await idbAll('ref')).map(r => [r.id, r.blob]));
  S.refs = [];
  for(const r of m.refs || []){
    const b = blobs.get(r.id);
    if(!b) continue;
    try{ const im = await loadImg(b); S.refs.push(Object.assign({}, r, { blob: b, img: im, iw: im.naturalWidth, ih: im.naturalHeight })); }catch(e){}
  }
  S.refSel = refById(m.refSel) ? m.refSel : null;
  return true;
}
function newProject(){
  selSettle(); if(S.playing) stopPlay();
  pix.clear(); thumbs.clear();
  S.pid = uid('r'); S.name = 'ROUGH';
  S.frames = [blankFrame(2)];
  S.cur = 0; S.tick = 0;
  S.refs.forEach(r => removedRefs.add(r.id));

async function changeSize(w, h){
  w = w | 0; h = h | 0;
  if(!(w >= MIN_SIDE && h >= MIN_SIDE && w <= MAX_SIDE && h <= MAX_SIDE) || w * h > MAX_AREA){ toast('大きさは ' + MIN_SIDE + '〜' + MAX_SIDE + 'px・面積は 4K まで'); return; }
  if(w === S.W && h === S.H) return;
  if(!await confirmBox('紙を ' + w + '×' + h + ' に変えますか？\n絵は中央に置いたまま（はみ出す所は切れます）。Undo は空になります。', '変える')) return;
  selSettle(); if(S.playing) stopPlay();
  const ox = Math.round((w - S.W) / 2), oy = Math.round((h - S.H) / 2);
  for(const [id, buf] of pix){
    const nb = new Uint8Array(w * h);
    for(let y = 0; y < S.H; y++){
      const ny = y + oy; if(ny < 0 || ny >= h) continue;
      const x0 = Math.max(0, -ox), x1 = Math.min(S.W, w - ox);
      if(x1 > x0) nb.set(buf.subarray(y * S.W + x0, y * S.W + x1), ny * w + x0 + ox);
    }
    pix.set(id, nb);
  }
  S.refs.forEach(r => { r.x += ox; r.y += oy; });
  S.W = w; S.H = h;
  histClear(); snapBuf = null;
  setupCanvas(); fitView(); renderRef(); showFrame();
  S.frames.forEach(f => { updateThumb(f); });
  buildTimeline();
  savedPix.clear(); dirtyMeta();
  S.frames.forEach(f => dirtyPix(f.id));
  toast('紙を ' + w + '×' + h + ' にしました');

/* ============================================================ §18 書き出し・送る
   PNG／連番（無圧縮 ZIP・依存ゼロ）／プロジェクト JSON（PROJECT_v1＋rough）／→ ANIMATOR REF（tdr_exchange＋tdr_live） */
function outLUT(full){ return full ? makeLUT({}) : makeLUT({ rough: P.out.rough, note: P.out.note }); }
function frameCanvas(f, opt){
  opt = opt || {};
  const c = document.createElement('canvas'); c.width = S.W; c.height = S.H;
  const g = c.getContext('2d');
  if(opt.bg === 'paper'){ g.fillStyle = paperHex(); g.fillRect(0, 0, S.W, S.H); }
  if(opt.ref && P.refShow){
    const t = document.createElement('canvas'); t.width = S.W; t.height = S.H;
    const tg = t.getContext('2d');
    drawRefs(tg, 1);
    if(P.refMono) monoInPlace(tg);
    g.globalAlpha = P.refOp / 100; g.drawImage(t, 0, 0); g.globalAlpha = 1;
  }
  if(f && f.kind === 'draw'){
    const t = document.createElement('canvas'); t.width = S.W; t.height = S.H;
    paintRect(t.getContext('2d'), pix.get(f.id), 0, 0, S.W, S.H, opt.lut || outLUT());
    g.drawImage(t, 0, 0);
  }
  return c;
}
function monoInPlace(g){
  const im = g.getImageData(0, 0, S.W, S.H), d = im.data;
  for(let i = 0; i < d.length; i += 4){ const l = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; d[i] = d[i + 1] = d[i + 2] = l; }
  g.putImageData(im, 0, 0);
}
const canvasBlob = c => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('PNG にできません')), 'image/png'));
function safeName(){ return (S.name || 'rough').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || 'rough'; }
function stamp(){ const d = new Date(), p2 = n => String(n).padStart(2, '0'); return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()); }
function download(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
async function exportPNG(){
  selSettle();

let exCancel = false;
function exShow(msg){ exCancel = false; $('#ex-msg').textContent = msg; exProg(0, ''); $('#ex-ov').classList.add('show'); }
function exProg(p, t){ $('#ex-bar i').style.width = (p * 100).toFixed(1) + '%'; $('#ex-prog').textContent = t || ''; }
function exHide(){ $('#ex-ov').classList.remove('show'); }
async function exportSeq(){

  exShow('連番 PNG を作っています…');
  try{
    const files = [], cache = new Map();
    const enc = async f => {
      const key = f.kind === 'draw' ? f.id : '_empty';
      if(cache.has(key)) return cache.get(key);
      const b = new Uint8Array(await (await canvasBlob(frameCanvas(f.kind === 'draw' ? f : null, { bg: P.out.bg, ref: P.out.ref }))).arrayBuffer());
      cache.set(key, b);
      return b;
    };
    if(mode === 'tick'){
      const tot = totalTicks();
      let t = 0;
      for(const f of S.frames){
        const b = await enc(f);
        for(let k = 0; k < f.dur; k++){ files.push({ name: base + '/' + base + '_' + pad(t + 1, 4) + '.png', data: b }); t++; }
        exProg(t / tot, t + ' / ' + tot + ' コマ');
        if(exCancel) throw new Error('cancel');
      }
    }else{
      const lines = ['frame,drawing,duration'];
      let t = 0, n = 0;
      for(let i = 0; i < S.frames.length; i++){
        const f = S.frames[i];
        if(f.kind === 'draw'){ n++; files.push({ name: base + '/' + base + '_d' + pad(n) + '.png', data: await enc(f) }); lines.push((t + 1) + ',' + pad(n) + ',' + f.dur); }
        else lines.push((t + 1) + ',×,' + f.dur);
        t += f.dur;
        exProg((i + 1) / S.frames.length, (i + 1) + ' / ' + S.frames.length + ' 絵');
        if(exCancel) throw new Error('cancel');
      }
      files.push({ name: base + '/timesheet.csv', data: new TextEncoder().encode(lines.join('\n') + '\n') });
    }
    exProg(1, 'ZIP にまとめています…');
    download(zipStore(files), 'rough-' + base + '-' + (mode === 'tick' ? P.fps + 'fps' : 'cels') + '-' + stamp() + '.zip');

/* 無圧縮 ZIP（PNG は圧縮済みなので store で十分。CRC32 だけ計算する） */
const CRC_T = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(a){ let c = 0xFFFFFFFF; for(let i = 0; i < a.length; i++) c = CRC_T[(c ^ a[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const parts = [], central = [];
  const now = new Date(), dt = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dd = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  let off = 0;
  const te = new TextEncoder();
  const crcCache = new Map();
  for(const f of files){
    const name = te.encode(f.name), d = f.data;
    let crc = crcCache.get(d); if(crc === undefined){ crc = crc32(d); crcCache.set(d, crc); }
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, name, d);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c.buffer, name);
    off += 30 + name.length + d.length;
  }
  let csz = 0; central.forEach(x => csz += x.byteLength);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csz, true); e.setUint32(16, off, true);
  return new Blob(parts.concat(central, [e.buffer]), { type: 'application/zip' });
}
/* PROJECT_v1（ANIMATOR の EXPORT JSON と同じ形）。full＝下書／指示も必ず入れる（保存用） */
async function buildProjectV1(opt){
  opt = opt || {};
  const lut = outLUT(!!opt.full);
  const cells = [];
  for(let i = 0; i < S.frames.length; i++){
    const f = S.frames[i];
    if(f.kind === 'empty'){ cells.push({ id: f.id, kind: 'empty', duration: f.dur }); continue; }
    const c = frameCanvas(f, { lut });
    cells.push({ id: f.id, kind: 'draw', duration: f.dur, image: c.toDataURL('image/png') });
    exProg((i + 1) / S.frames.length, (i + 1) + ' / ' + S.frames.length + ' コマ');
    await new Promise(r => setTimeout(r, 0));   // 進み具合を描かせる（toDataURL は同期で重い）
  }
  return {
    format: 'PROJECT_v1', projectId: 'rough_' + S.pid, name: S.name, from: 'ROUGH',
    exportedAt: new Date().toISOString(), fps: P.fps, durationUnit: 'frames',
    width: S.W, height: S.H, bgBright: P.paper,
    workArea: { startFrame: 0, endFrame: totalTicks() },
    cellCount: cells.length, cells,
  };
}
async function saveProject(){
  selSettle();

      const url = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(null); fr.readAsDataURL(r.blob); });
      if(url) refs.push({ name: r.name, x: r.x, y: r.y, s: r.s, rot: r.rot, op: r.op, vis: r.vis, lock: r.lock, flip: r.flip, src: url });
    }

async function openProjectFile(file){
  let json;
  try{ json = JSON.parse(await file.text()); }catch(e){ await alertBox('JSON を読めませんでした'); return; }
  if(!json || json.format !== 'PROJECT_v1' || !Array.isArray(json.cells)){ await alertBox('ROUGH / ANIMATOR のプロジェクト JSON（PROJECT_v1）ではありません'); return; }
  if(!await confirmBox('「' + (json.name || file.name) + '」を開きますか？\nいまの作業と置き換えます（残すなら先に ⇩ SAVE）。', '開く')) return;
  selSettle(); if(S.playing) stopPlay();
  exShow('開いています…');
  try{
    const W = json.width | 0, H = json.height | 0;
    if(!(W >= MIN_SIDE && H >= MIN_SIDE && W * H <= MAX_AREA)) throw new Error('紙の大きさが範囲外です（' + W + '×' + H + '）');
    const rx = json.rough || null;
    const cols = rx && rx.colors ? rx.colors : null;
    // 量子化はファイル側の下書／指示の色で（画面の色は今の設定のまま）
    const keepR = P.colRough, keepN = P.colNote;
    if(cols){ P.colRough = cols.rough || keepR; P.colNote = cols.note || keepN; }
    const q = quantizer();
    P.colRough = keepR; P.colNote = keepN;
    pix.clear(); thumbs.clear();
    S.W = W; S.H = H;
    const frames = [];

    for(let i = 0; i < json.cells.length; i++){
      const c = json.cells[i], dur = Math.max(1, c.duration | 0);
      if(c.kind === 'empty' || !c.image){ frames.push({ id: c.id || uid('f'), kind: 'empty', dur }); continue; }
      const im = await new Promise((res, rej) => { const m = new Image(); m.onload = () => res(m); m.onerror = () => rej(new Error('画像を読めません（' + (i + 1) + '）')); m.src = c.image; });
      tg.clearRect(0, 0, W, H); tg.drawImage(im, 0, 0, W, H);
      const d = tg.getImageData(0, 0, W, H).data, buf = new Uint8Array(W * H);
      for(let k = 0, j = 0; k < buf.length; k++, j += 4) if(d[j + 3] >= 128) buf[k] = q(d[j], d[j + 1], d[j + 2], d[j + 3]);
      const id = uid('f');
      pix.set(id, buf);
      frames.push({ id, kind: 'draw', dur });
      exProg((i + 1) / json.cells.length, (i + 1) + ' / ' + json.cells.length);
    }
    if(!frames.length) frames.push(blankFrame(2));
    S.frames = frames;
    S.pid = rx && rx.pid ? rx.pid : uid('r');
    S.name = String(json.name || 'ROUGH').slice(0, 40);
    if(json.fps) P.fps = json.fps;
    S.refs.forEach(r => removedRefs.add(r.id));
    S.refs = []; S.refSel = null;
    if(rx && Array.isArray(rx.refs)){
      for(const r of rx.refs){
        try{
          const b = await (await fetch(r.src)).blob();
          const o = await addRefBlob(b, r.name);
          Object.assign(o, { x: r.x, y: r.y, s: r.s, rot: r.rot || 0, op: r.op == null ? 100 : r.op, vis: r.vis !== false, lock: !!r.lock, flip: !!r.flip });
        }catch(e){}
      }
    }
    S.cur = clamp(rx && rx.cur | 0 || 0, 0, S.frames.length - 1);
    S.tick = frameStart(S.cur);
    histClear(); savedPix.clear(); snapBuf = null;
    setupCanvas(); fitView(); renderRef(); renderRefPanel(); showFrame();
    S.frames.forEach(f => updateThumb(f));
    buildTimeline();
    dirtyMeta(); S.frames.forEach(f => dirtyPix(f.id));
    toast('開きました：' + S.name + '（' + S.frames.length + ' コマ・' + W + '×' + H + '）');
  }catch(err){ console.error(err); await alertBox('開けませんでした：' + err.message); newProject(); }
  finally{ exHide(); }
}
/* → ANIMATOR REF：共有DB（tdr_exchange）に PROJECT_v1 を置き、受け箱（localStorage tdr_ref_inbox）に名札を入れ、tdr_live で知らせる。
   ANIMATOR は「知らせ／タブに戻った／起動」のどれかで受け箱を見て REF に入れる（同じ projectId なら絵だけ差し替え）。 */
const EX_DB = 'tdr_exchange', EX_STORE = 'projects', INBOX_KEY = 'tdr_ref_inbox';
function exOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(EX_DB, 1);
    r.onupgradeneeded = () => { const d = r.result; if(!d.objectStoreNames.contains(EX_STORE)) d.createObjectStore(EX_STORE, { keyPath: 'projectId' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function exPut(rec){
  const d = await exOpen();
  await new Promise((res, rej) => { const tx = d.transaction(EX_STORE, 'readwrite'); tx.objectStore(EX_STORE).put(rec); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  d.close();
}
let gLive = null, gAckWait = null;
function setupLive(){
  if(typeof BroadcastChannel === 'undefined') return;
  try{ gLive = new BroadcastChannel('tdr_live'); }catch(e){ return; }
  gLive.onmessage = ev => {
    const m = ev.data; if(!m) return;
    if(m.type === 'ref-ack' && gAckWait && m.projectId === gAckWait.id) gAckWait.done(m);
  };
}
async function sendToAnimator(){
  selSettle(); if(S.playing) stopPlay();
  if(!S.frames.some(f => f.kind === 'draw')){ toast('絵のコマがありません'); return; }
  exShow('ANIMATOR へ送っています…');
  let rec;
  try{
    rec = await buildProjectV1({});
    await exPut(rec);
    let box = [];
    try{ box = JSON.parse(localStorage.getItem(INBOX_KEY) || '[]') || []; }catch(e){ box = []; }
    box = box.filter(x => x && x.projectId !== rec.projectId);
    box.push({ projectId: rec.projectId, name: rec.name, from: 'ROUGH', at: Date.now() });
    localStorage.setItem(INBOX_KEY, JSON.stringify(box.slice(-8)));
  }catch(err){ exHide(); console.error(err); await alertBox('送れませんでした：' + err.message); return; }
  exHide();
  const ack = await new Promise(res => {
    const t = setTimeout(() => { gAckWait = null; res(null); }, 1200);
    gAckWait = { id: rec.projectId, done: m => { clearTimeout(t); gAckWait = null; res(m); } };
    if(gLive) gLive.postMessage({ type: 'ref-push', projectId: rec.projectId, name: rec.name, from: 'ROUGH' });
  });
  if(ack){ toast('ANIMATOR の REF に' + (ack.updated ? '差し替えました' : '入れました') + '（' + rec.name + '・' + rec.cellCount + ' コマ）', 3600); return; }
  const v = await modal('共有DBに置きました（' + rec.name + '・' + rec.cellCount + ' コマ）。\n\nANIMATOR がまだ開いていないようです。\n・開いているなら、そのタブに切り替えるだけで REF に入ります\n・開いていなければ、開いたときに入ります\n（ANIMATOR の REF ▸ + FROM SAVED にも出ます）',
    [{ label: 'OK', value: 0, esc: true }, { label: 'ANIMATOR を開く', value: 1, pri: true }]);
  if(v === 1){ flushSave(); window.open('animator.html', '_blank'); }
}

  $('#tone-2').addEventListener('click', () => setTone(2));
  $('#hide-rough').addEventListener('click', () => toggleHide('rough'));
  $('#hide-note').addEventListener('click', () => toggleHide('note'));
  $('#clr-rough').addEventListener('click', () => clearColor(IDX_ROUGH));
  $('#clr-note').addEventListener('click', () => clearColor(IDX_NOTE));
  $('#b-undo').addEventListener('click', undo);
  $('#b-redo').addEventListener('click', redo);
  $('#b-send').addEventListener('click', sendToAnimator);
  $('#b-save').addEventListener('click', saveProject);
  $('#b-open').addEventListener('click', () => $('#proj-in').click());
  $('#b-set').addEventListener('click', () => toggleSettings());
  $('#set-close').addEventListener('click', () => toggleSettings(false));
  $('#set-ovl').addEventListener('click', e => { if(e.target.id === 'set-ovl') toggleSettings(false); });
  $('#set-body').addEventListener('click', onSettings);
  $('#set-body').addEventListener('input', onSettingsInput);
  $('#set-body').addEventListener('change', onSettingsInput);
  const canFS = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  if(!canFS) $('#b-fs').style.display = 'none';
  $('#b-fs').addEventListener('click', () => {
    const d = document, el = d.documentElement;
    if(d.fullscreenElement || d.webkitFullscreenElement){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  });
  const goHome = e => { flushSave(); };
  $('#b-home').addEventListener('click', goHome); $('#brand').addEventListener('click', goHome);
  $('#zh-in').addEventListener('click', () => zoomStep(1));
  $('#zh-out').addEventListener('click', () => zoomStep(-1));
  $('#zh-fit').addEventListener('click', fitAction);
  $('#zh-rot').addEventListener('click', () => setRot(0));
  $('#zh-flip').addEventListener('click', toggleFlip);
  $('#sel-hud').addEventListener('click', e => { const b = e.target.closest('[data-sel]'); if(b) onSelHud(b.dataset.sel); });
  $('#brush-body').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(b) onBrushAct(b.dataset.act, b.dataset.v); });
  $('#ref-body').addEventListener('click', onRefPanel);
  $('#out-body').addEventListener('click', onOut);
  $('#ref-in').addEventListener('change', async e => { const fs = Array.from(e.target.files || []); e.target.value = ''; await addRefFiles(fs); });
  $('#proj-in').addEventListener('change', async e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if(f) await openProjectFile(f); });
  $('#ex-cancel').addEventListener('click', () => { exCancel = true; });
  $('#tl-play').addEventListener('click', togglePlay);
  $('#tl-loop').addEventListener('click', () => { P.loop = !P.loop; savePrefs(); $('#tl-loop').classList.toggle('on', P.loop); });
  $('#on-tog').addEventListener('click', toggleOnion);
  $('#on-prev').addEventListener('click', () => cycleOnion('prev'));
  $('#on-next').addEventListener('click', () => cycleOnion('next'));
  $('#f-new').addEventListener('click', frameNew);
  $('#f-dup').addEventListener('click', () => frameDup(false));
  $('#f-under').addEventListener('click', () => frameDup(true));
  $('#f-del').addEventListener('click', frameDel);
  $('#f-left').addEventListener('click', () => frameShift(-1));
  $('#f-right').addEventListener('click', () => frameShift(1));
  $('#tl-zin').addEventListener('click', () => tlZoom(1.25));
  $('#tl-zout').addEventListener('click', () => tlZoom(1 / 1.25));
  bindScrub(document.body);
}
function setupStageInput(){
  stageEl.addEventListener('pointerdown', stageDown, { passive: false });
  stageEl.addEventListener('pointermove', stageMove);
  stageEl.addEventListener('pointerup', stageUp);
  stageEl.addEventListener('pointercancel', e => {
    if(e.pointerType === 'touch'){ touchEnd(e); return; }
    if(e.pointerType === 'pen') penDown = false;
    if(drag && drag.id === e.pointerId){ const d = drag; drag = null; dragEnd(d, e); }
  });
  stageEl.addEventListener('pointerleave', e => { if(!drag && e.pointerType !== 'touch'){ hoverPt = null; drawOv(); } });
  stageEl.addEventListener('dblclick', e => { if(!(e.target.closest && e.target.closest(ON_STAGE_UI))) stageDbl(e); });
  stageEl.addEventListener('wheel', e => { if(e.target.closest && e.target.closest(ON_STAGE_UI)) return; stageWheel(e); }, { passive: false });
  stageEl.addEventListener('contextmenu', e => e.preventDefault());
  // 画像を落とす＝下絵（REF）に置く。プロジェクト JSON を落とす＝開く
  stageEl.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragover'); });
  stageEl.addEventListener('dragleave', () => document.body.classList.remove('dragover'));
  stageEl.addEventListener('drop', async e => {
    e.preventDefault(); document.body.classList.remove('dragover');
    const fs = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
    const js = fs.find(f => /\.json$/i.test(f.name) || f.type === 'application/json');
    if(js){ await openProjectFile(js); return; }
    await addRefFiles(fs);
  });
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { spaceDown = false; handKey = false; stageEl.classList.remove('pan'); clearTimeout(holdTimer); });
  window.addEventListener('paste', onPaste);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushSave(); });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('resize', () => { $$('.pnl.float').forEach(el => { const k = el.dataset.pid; placeFloat(el, LAYOUT[k]); }); });
}
const gBoot = (async function boot(){
  stageEl = $('#stage'); wrapEl = $('#wrap');
  cvWork = $('#cv-work'); cxWork = cvWork.getContext('2d');
  cvOnion = $('#cv-onion'); cxOnion = cvOnion.getContext('2d');
  cvRef = $('#cv-ref'); cxRef = cvRef.getContext('2d', { willReadFrequently: true });
  cvFloat = $('#cv-float'); cxFloat = cvFloat.getContext('2d');
  cvOv = $('#cv-ov'); cxOv = cvOv.getContext('2d');
  buildTone();
  loadLayout(); applyLayout();
  setupScrubDefs(); setupStaticUI(); setupPanels(); setupTimelineInput(); setupStageInput(); setupLive();
  let loaded = false;
  if(!HARNESS){
    try{ db = await openDB(); loaded = await loadProject(); }
    catch(err){ console.warn('IndexedDB unavailable', err); setSaveSt('err'); }
  }
  if(!loaded){ S.frames = [blankFrame(2)]; S.cur = 0; S.tick = 0; }
  setupCanvas();
  new ResizeObserver(() => onStageResize()).observe(stageEl);
  onStageResize(); fitView();
  renderRef(); showFrame();
  S.frames.forEach(f => updateThumb(f));
  buildTimeline();
  updateToolUI(); updateColorUI(); updateOnionUI(); renderBrush(); renderRefPanel(); renderOut(); updUndoUI();
  $('#tl-loop').classList.toggle('on', P.loop);
  setSaveSt(loaded ? 'saved' : '');
  if(!loaded && !HARNESS){ dirtyMeta(); dirtyPix(S.frames[0].id); }
  new ResizeObserver(() => layoutCells()).observe($('#tl-body'));
  setInterval(sweepPix, 60000);
})();
window.__ROUGH__ = { S, P, pix, HIST, ready: () => gBoot, get float(){ return gFloat; }, get clip(){ return gClip; }, flushSave: () => doSave() };
</script>
